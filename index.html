<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bookshelf of Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#EEF0EB; --panel:#FFFFFF; --panel-2:#F4F6F2; --ink:#161A18; --muted:#5E6965; --line:#D7DDD8; --line-strong:#B4BDB7;
  --accent:#B67A10; --accent-soft:#F6E7C4; --accent-ink:#FFFFFF; --danger:#B3402E; --ok:#2E7D5B;
  --tone-s:58%; --tone-bg-l:91%; --tone-fg-l:30%;
  --shadow:0 12px 32px rgba(20,30,26,.14); --shadow-sm:0 1px 2px rgba(20,30,26,.06);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1514; --panel:#1A2120; --panel-2:#212A28; --ink:#ECEFEA; --muted:#93A09A; --line:#2A3432; --line-strong:#41504C;
    --accent:#F0B646; --accent-soft:#3A2E12; --accent-ink:#1B1400; --danger:#F08A7A; --ok:#7BD3A8;
    --tone-s:42%; --tone-bg-l:24%; --tone-fg-l:82%;
    --shadow:0 12px 32px rgba(0,0,0,.5); --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1514; --panel:#1A2120; --panel-2:#212A28; --ink:#ECEFEA; --muted:#93A09A; --line:#2A3432; --line-strong:#41504C;
  --accent:#F0B646; --accent-soft:#3A2E12; --accent-ink:#1B1400; --danger:#F08A7A; --ok:#7BD3A8;
  --tone-s:42%; --tone-bg-l:24%; --tone-fg-l:82%;
  --shadow:0 12px 32px rgba(0,0,0,.5); --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
input,select,textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:none;line-height:1.4}
input[type="checkbox"]{width:auto}
input[type="date"],input[type="time"]{font-variant-numeric:tabular-nums}
.hidden,[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

#app{height:100dvh;display:flex;flex-direction:column;min-height:0}

/* ---------- top bar ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 18px 8px;padding-top:max(14px,env(safe-area-inset-top))}
.trip-btn{display:flex;align-items:center;gap:6px;text-align:left;border-radius:8px;padding:2px 6px 2px 0}
.trip-btn:hover{background:var(--panel-2)}
.trip-name{font:600 24px/1.1 var(--display);letter-spacing:-.01em;text-wrap:balance}
.trip-btn svg{width:16px;height:16px;color:var(--muted);flex:none}
.trip-sub{color:var(--muted);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;padding:6px 8px;white-space:nowrap}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.ok .dot{background:var(--ok)}
.status.busy .dot{background:var(--accent);animation:pulse 1s infinite}
.status.err{color:var(--danger)} .status.err .dot{background:var(--danger)}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover{background:var(--panel-2);color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.filters{display:flex;gap:6px;padding:4px 18px 10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500;color:var(--muted);background:var(--panel);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip .n{opacity:.6;font-variant-numeric:tabular-nums}

/* ---------- board ---------- */
.main{flex:1;display:flex;min-height:0;position:relative}
.board{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;display:flex;gap:14px;padding:4px 18px 16px;align-items:stretch;scroll-snap-type:x proximity;scroll-padding-left:18px;-webkit-overflow-scrolling:touch}
.col{flex:0 0 300px;width:300px;display:flex;flex-direction:column;min-height:0;scroll-snap-align:start;border-radius:14px;transition:background .15s}
.col.drop{background:var(--accent-soft)}
.col-head{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 10px 10px;gap:8px}
.col-head .dow{font:600 20px/1 var(--display);letter-spacing:-.01em}
.col-head .date{color:var(--muted);font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}
.col-head .cnt{color:var(--muted);font-size:12px;white-space:nowrap}
.col-head .menu{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.col-head .menu:hover{background:var(--panel-2);color:var(--ink)}
.col-head .menu svg{width:16px;height:16px}
.col-body{flex:1;min-height:0;overflow-y:auto;padding:2px 4px 8px;display:flex;flex-direction:column;scrollbar-width:thin}
.col.unsched .col-head .dow{color:var(--muted);font-weight:500}
.col.addday{flex-basis:200px;width:200px}
.addday-btn,.newcard{display:flex;align-items:center;gap:8px;color:var(--muted);padding:10px 12px;border-radius:12px;border:1px dashed var(--line-strong);font-weight:500;width:100%;text-align:left}
.addday-btn:hover,.newcard:hover{color:var(--ink);background:var(--panel);border-style:solid}
.newcard{margin-top:6px;border-style:solid;border-color:transparent}
.newcard:hover{border-color:var(--line)}
.addday-btn svg,.newcard svg{width:16px;height:16px}
.empty-col{color:var(--muted);font-size:13px;padding:8px 12px}

/* card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 12px;box-shadow:var(--shadow-sm);cursor:pointer;user-select:none;-webkit-user-select:none;position:relative;transition:transform .12s,box-shadow .12s}
.card:hover{border-color:var(--line-strong)}
.card.dragging{opacity:.35}
.card.ghost{position:fixed;z-index:100;pointer-events:none;box-shadow:var(--shadow);transform-origin:center;opacity:.96;cursor:grabbing}
.card.archived{opacity:.55}
.card.archived .title{text-decoration:line-through;text-decoration-color:var(--muted)}
.card-cat{display:flex;align-items:center;gap:5px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:hsl(var(--h) var(--tone-s) var(--tone-fg-l));margin-bottom:6px}
.card-cat i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.card-head{display:flex;align-items:flex-start;gap:8px}
.card-emoji{font-size:20px;line-height:22px;width:24px;flex:none;text-align:center}
.card-emoji.none{opacity:.25}
.title{font:600 15px/1.25 var(--display);flex:1;min-width:0;overflow-wrap:anywhere;padding-top:2px}
.title.untitled{color:var(--muted);font-weight:500}
.grip{flex:none;width:26px;height:26px;margin:-4px -4px 0 0;border-radius:6px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;opacity:.55}
.grip:hover{opacity:1;background:var(--panel-2)}
.grip svg{width:14px;height:14px}
.card-res{margin-top:6px;font-size:13px;color:var(--ink)}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;line-height:1;padding:5px 8px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--panel-2);color:var(--muted)}
.chip.tone{background:hsl(var(--h) var(--tone-s) var(--tone-bg-l));color:hsl(var(--h) var(--tone-s) var(--tone-fg-l))}
.stars{font-size:12px;letter-spacing:1px;color:var(--accent)}
.note{display:flex;gap:7px;margin-top:8px;font-size:13px;line-height:1.35;align-items:flex-start}
.note .who{flex:none;width:18px;height:18px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.card-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px;color:var(--muted);align-items:center}
.card-foot .outfit{display:inline-flex;gap:4px;align-items:center;overflow-wrap:anywhere}

/* transport connector between cards */
.link{display:grid;grid-template-columns:24px 1fr;align-items:center;min-height:34px;padding-left:12px;gap:4px}
.link .line{justify-self:center;width:0;height:100%;min-height:34px;border-left:2px dashed var(--line-strong)}
.link.empty .line{opacity:.6}
.link .chip{justify-self:start}
.link .addtr{color:var(--muted);font-size:12px;opacity:0;padding:4px 6px;border-radius:6px}
.link:hover .addtr,.link:focus-within .addtr{opacity:1}
.link .addtr:hover{background:var(--panel)}
.gap{height:8px}
@media (hover:none){.link .addtr{opacity:.75}}

/* ---------- editor ---------- */
.editor{width:440px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:none;flex-direction:column;min-height:0}
.editor.open{display:flex}
.ed-top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 0}
.ed-scroll{flex:1;overflow-y:auto;padding:6px 20px 32px}
.ed-hero{display:flex;gap:12px;align-items:flex-start;margin:6px 0 18px}
.emoji-btn{width:52px;height:52px;border-radius:12px;border:1px dashed var(--line-strong);font-size:30px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--panel-2)}
.emoji-btn.has{border-style:solid;border-color:transparent}
.ed-title{font:600 24px/1.15 var(--display);background:none;border:0;padding:8px 0;border-radius:0;letter-spacing:-.01em}
.ed-title:focus{box-shadow:none}
.emoji-pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px;width:296px}
.emoji-pop input{margin-bottom:8px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emoji-grid button{font-size:20px;height:32px;border-radius:6px}
.emoji-grid button:hover{background:var(--panel-2)}
.prop{display:grid;grid-template-columns:140px 1fr;gap:10px;align-items:start;padding:5px 0;min-height:40px}
.prop-k{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop-k svg{width:16px;height:16px;flex:none}
.prop-v{min-width:0}
.prop-v .row{display:flex;gap:8px;align-items:center}
.prop-v .row input[type="number"]{width:84px;flex:none}
.switch{display:inline-flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer}
.switch input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line-strong);position:relative;margin:0;padding:0;border:0;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:16px}
.switch input:focus{box-shadow:0 0 0 3px var(--accent-soft)}
.rating{display:flex;gap:2px;padding:6px 0}
.rating button{font-size:20px;line-height:1;color:var(--line-strong);padding:2px}
.rating button.on{color:var(--accent)}
.rating .clear{font-size:12px;color:var(--muted);margin-left:8px;align-self:center}
.ed-foot{display:flex;gap:8px;padding:16px 0 0;border-top:1px solid var(--line);margin-top:18px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 10%,var(--panel))}
.btn svg{width:16px;height:16px}
.ed-hint{color:var(--muted);font-size:12px;margin-top:6px}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}

/* ---------- popover / dialogs ---------- */
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:200px;max-width:min(320px,calc(100vw - 24px))}
.pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:14px}
.pop button:hover{background:var(--panel-2)}
.pop button.danger{color:var(--danger)}
.pop button .chk{width:16px;flex:none;color:var(--accent);text-align:center}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.pop .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px 2px;font-weight:600}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:0;width:min(520px,calc(100vw - 24px));box-shadow:var(--shadow);max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 40px);overflow-y:auto}
.dlg h2{font:600 22px/1.15 var(--display);margin:0;letter-spacing:-.01em}
.dlg p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.field .hint{font-size:12px;color:var(--muted)}
.fields-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.catrow{display:grid;grid-template-columns:52px 1fr 36px;gap:6px;align-items:center}
.catrow input.em{text-align:center;font-size:18px;padding:5px}
.catrow .del{color:var(--muted);width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.catrow .del:hover{background:var(--panel-2);color:var(--danger)}
.catlist{display:flex;flex-direction:column;gap:6px}

/* empty / loading */
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.hello{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.hello h1{font:600 30px/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.hello p{color:var(--muted);margin:0}

/* ---------- mobile ---------- */
@media (max-width:760px){
  .top{padding:12px 14px 6px;padding-top:max(12px,env(safe-area-inset-top))}
  .trip-name{font-size:21px}
  .filters{padding:2px 14px 8px}
  .board{gap:10px;padding:2px 14px 12px;scroll-snap-type:x mandatory;scroll-padding-left:14px}
  .col{flex-basis:calc(100vw - 52px);width:calc(100vw - 52px)}
  .col.addday{flex-basis:170px;width:170px}
  .editor{position:fixed;left:0;right:0;bottom:0;top:auto;height:min(92dvh,100%);width:auto;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;z-index:40;box-shadow:var(--shadow);transform:translateY(100%);transition:transform .22s ease;display:flex}
  .editor.open{transform:translateY(0)}
  .ed-scroll{padding:4px 16px calc(24px + env(safe-area-inset-bottom))}
  .backdrop.open{display:block}
  .prop{grid-template-columns:120px 1fr}
  .status .txt{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <div class="filters" id="filters"></div>
  <div class="main">
    <div class="board" id="board"></div>
    <aside class="editor" id="editor" aria-label="Card details"></aside>
  </div>
</div>
<div class="backdrop" id="backdrop"></div>
<dialog id="dlg"></dialog>

<script>
(() => {
'use strict';

/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'style') n.style.cssText = v;
    else if (k === 'dataset') Object.assign(n.dataset, v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'selected' || k === 'disabled') n[k] = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return n;
};
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const parseDate = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (iso, n) => { const d = parseDate(iso); d.setDate(d.getDate() + n); return toISO(d); };
const today = () => toISO(new Date());
const fmtDate = (iso, o) => parseDate(iso).toLocaleDateString(undefined, o || { month: 'short', day: 'numeric', year: 'numeric' });
const weekday = iso => parseDate(iso).toLocaleDateString(undefined, { weekday: 'long' });
const fmtTime = t => {
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  return `${((h + 11) % 12) + 1}:${pad(m)} ${h >= 12 ? 'PM' : 'AM'}`;
};
const fmtRange = days => {
  if (!days.length) return 'No days yet';
  const a = parseDate(days[0]), b = parseDate(days[days.length - 1]);
  if (days.length === 1) return fmtDate(days[0]);
  if (a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth())
    return `${a.toLocaleDateString(undefined, { month: 'short' })} ${a.getDate()} – ${b.getDate()}, ${b.getFullYear()}`;
  return `${fmtDate(days[0], { month: 'short', day: 'numeric' })} – ${fmtDate(days[days.length - 1])}`;
};
const initials = name => name.trim().split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase() || '·';
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

const ICONS = {
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  dots: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>',

/* ================= storage backends ================= */
class LocalStore {
  constructor() {
    this.key = 'bookshelf-of-memories/v1';
    this.data = this.read();
    this.tripCb = null; this.evCb = null; this.evTrip = null;
    window.addEventListener('storage', e => {
      if (e.key !== this.key) return;
      this.data = this.read();
      this.tripCb && this.tripCb(Object.values(this.data.trips));
      this.evCb && this.evCb(Object.values(this.data.events[this.evTrip] || {}));
    });
  }
  read() { try { return JSON.parse(localStorage.getItem(this.key)) || { trips: {}, events: {} }; } catch { return { trips: {}, events: {} }; } }
  persist() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { throw { code: 'unavailable', message: 'Could not save to this browser' }; } }
  watchTrips(cb) { this.tripCb = cb; cb(Object.values(this.data.trips)); return () => { this.tripCb = null; }; }
  watchEvents(tripId, cb) { this.evCb = cb; this.evTrip = tripId; cb(Object.values(this.data.events[tripId] || {})); return () => { this.evCb = null; }; }
  async saveTrip(t) { this.data.trips[t.id] = t; this.persist(); }
  async deleteTrip(id) { delete this.data.trips[id]; delete this.data.events[id]; this.persist(); }
  async saveEvent(tripId, ev) { (this.data.events[tripId] ||= {})[ev.id] = ev; this.persist(); }
  async deleteEvent(tripId, id) { delete (this.data.events[tripId] || {})[id]; this.persist(); }
}
class DbStore {
  constructor(db) { this.db = db; }
  async retry(fn) {
    try { return await fn(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return fn(); }
      throw e;
    }
  }
  watchTrips(cb, err) { return this.db.collection('trips').onSnapshot(s => cb(s.docs.filter(d => d.exists).map(d => d.data())), err); }
  watchEvents(tripId, cb, err) { return this.db.collection('trips/' + tripId + '/events').onSnapshot(s => cb(s.docs.filter(d => d.exists).map(d => d.data())), err); }
  saveTrip(t) { return this.retry(() => this.db.doc('trips/' + t.id).set(clone(t))); }
  async deleteTrip(id) {
    const evs = await this.db.collection('trips/' + id + '/events').get();
    for (const d of evs.docs) await this.db.doc('trips/' + id + '/events/' + d.id).delete();
    await this.retry(() => this.db.doc('trips/' + id).delete());
  }
  saveEvent(tripId, ev) { return this.retry(() => this.db.doc('trips/' + tripId + '/events/' + ev.id).set(clone(ev))); }
  deleteEvent(tripId, id) { return this.retry(() => this.db.doc('trips/' + tripId + '/events/' + id).delete()); }
}

  if (S.lastError) { s.classList.add('err'); s.querySelector('.txt').textContent = S.lastError; s.title = S.lastError; return; }
  if (S.savingCount > 0) { s.classList.add('busy'); s.querySelector('.txt').textContent = 'Saving…'; }

/* ================= trips ================= */

function saveTrip(t, { debounced } = {}) {

  const write = () => {
    const snap = clone(t);
    track(Promise.resolve(S.store.saveTrip(snap)).then(() => { if (S.pendingTrip[t.id] === t) delete S.pendingTrip[t.id]; }));
  };

  try { localStorage.setItem('bookshelf-of-memories/last-trip', id); } catch {}

  if (!id) { renderAll(); return; }
  S.unsubEvents = S.store.watchEvents(id, list => {
    const next = {};
    for (const e of list) next[e.id] = S.pending[e.id] || e;
    for (const pid in S.pending) if (!next[pid] && S.pending[pid]) next[pid] = S.pending[pid];
    S.events = next;

}

/* ================= drag & drop ================= */
function attachDrag(card, grip, ev) {
  card.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const onGrip = grip.contains(e.target);
    if (e.pointerType !== 'mouse' && !onGrip) return; // touch: scroll unless on the grip
    e.preventDefault();
    const board = $('#board');
    const startX = e.clientX, startY = e.clientY, rect = card.getBoundingClientRect();
    let ghost = null, raf = 0, dir = 0, over = null;
    card.setPointerCapture(e.pointerId);
    const loop = () => { if (dir) board.scrollLeft += dir * 12; raf = requestAnimationFrame(loop); };
    const begin = () => {
      ghost = card.cloneNode(true); ghost.className = 'card ghost';
      ghost.style.width = rect.width + 'px'; ghost.style.left = rect.left + 'px'; ghost.style.top = rect.top + 'px';
      document.body.append(ghost); card.classList.add('dragging'); loop();
    };
    const move = m => {
      if (!ghost) { if (Math.hypot(m.clientX - startX, m.clientY - startY) < 5) return; begin(); }
      ghost.style.transform = `translate(${m.clientX - startX}px,${m.clientY - startY}px) rotate(1.5deg)`;
      const b = board.getBoundingClientRect();
      dir = m.clientX < b.left + 44 ? -1 : m.clientX > b.right - 44 ? 1 : 0;
      const col = document.elementsFromPoint(m.clientX, m.clientY).find(n => n.classList && n.classList.contains('col') && n.dataset.date !== undefined);
      if (col !== over) { over && over.classList.remove('drop'); over = col || null; over && over.classList.add('drop'); }
    };
    const end = m => {
      card.removeEventListener('pointermove', move); card.removeEventListener('pointerup', end); card.removeEventListener('pointercancel', end);
      try { card.releasePointerCapture(e.pointerId); } catch {}
      cancelAnimationFrame(raf);
      if (!ghost) return; // a plain tap or click: the card's click handler opens the editor
      card._dragged = true; setTimeout(() => { card._dragged = false; }, 0);
      ghost.remove(); card.classList.remove('dragging');
      if (over) {
        over.classList.remove('drop');
        const date = over.dataset.date;
        const changes = {};
        if (date !== ev.date) changes.date = date;
        if (!ev.time) { // untimed cards keep a manual order
          const cards = [...over.querySelectorAll('.card:not(.dragging)')].map(c => S.events[c.dataset.id]).filter(x => x && !x.time);
          const rects = [...over.querySelectorAll('.card:not(.dragging)')].filter(c => S.events[c.dataset.id] && !S.events[c.dataset.id].time).map(c => c.getBoundingClientRect());
          let idx = rects.findIndex(r => m.clientY < r.top + r.height / 2); if (idx < 0) idx = cards.length;
          const before = cards[idx - 1], after = cards[idx];
          changes.order = before && after ? (before.order + after.order) / 2 : before ? before.order + 1000 : after ? after.order - 1000 : Date.now();
        }
        if (Object.keys(changes).length) patchEvent(ev.id, changes, { immediate: true });
      }
    };
    card.addEventListener('pointermove', move); card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
  });
}

  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (openPop) closePop(); else if (S.editingId && !$('#dlg').open) closeEditor(); } });
  window.addEventListener('beforeunload', () => { for (const id in S.pending) flushEvent(id); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) for (const id in S.pending) flushEvent(id); });

  let db = null;
  try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch (e) { console.warn(e); }
  S.store = db ? new DbStore(db) : new LocalStore();
  S.backend = db ? 'shared' : 'local';

  let first = true;
  S.store.watchTrips(list => {
    const next = {};
    for (const t of list) next[t.id] = S.pendingTrip[t.id] || t;
    for (const id in S.pendingTrip) if (!next[id]) next[id] = S.pendingTrip[id];
    S.trips = next;
    if (first) {
      first = false; S.ready = true;
      if (!list.length && S.backend === 'local') {
        const { trip: t, events } = sampleTrip();
        S.trips[t.id] = t; track(S.store.saveTrip(t)); for (const e of events) track(S.store.saveEvent(t.id, e));
      }
      let last = null; try { last = localStorage.getItem('bookshelf-of-memories/last-trip'); } catch {}
      const pick = S.trips[last] ? last : (Object.values(S.trips).sort((a, b) => a.createdAt - b.createdAt)[0] || {}).id || null;
      selectTrip(pick);
    } else if (S.tripId && !S.trips[S.tripId]) {
      const nxt = Object.values(S.trips).sort((a, b) => a.createdAt - b.createdAt)[0];
      selectTrip(nxt ? nxt.id : null);
    }
    renderAll();
  }, e => { S.lastError = 'Could not open the shared trip'; S.ready = true; renderAll(); });
}
boot();
})();
</script>
</body>
</html>
