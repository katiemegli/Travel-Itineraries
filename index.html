<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bookshelf of Memories</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: light)">
<link rel="icon" href="favicon-dark.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Geist+Mono:wght@300;400;500;700&family=Homemade+Apple&family=Inter:wght@300;400;500&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- design tokens: paper, ink, sand, sky, cream, lemon, olive, terra ---------- */
:root{
  --paper:#EBE6DC; --ink:#1B2B5E; --sand:#E8DCC8; --sky:#87BADB; --cream:#FAF3E0; --lemon:#F2C535; --olive:#7A8C5E; --terra:#C4704A;
  --ink-80:rgba(27,43,94,.8); --ink-70:rgba(27,43,94,.7); --ink-60:rgba(27,43,94,.6); --ink-50:rgba(27,43,94,.5); --ink-40:rgba(27,43,94,.4); --ink-30:rgba(27,43,94,.3); --ink-20:rgba(27,43,94,.2); --ink-10:rgba(27,43,94,.1); --ink-05:rgba(27,43,94,.05);
  --bg:var(--paper); --panel:rgba(255,255,255,.5); --panel-2:rgba(255,255,255,.3); --muted:var(--ink-60); --faint:var(--ink-40); --line:var(--ink-20); --line-soft:var(--ink-10); --line-strong:var(--ink);
  --accent:var(--ink); --accent-soft:rgba(135,186,219,.25); --accent-ink:var(--paper); --danger:var(--terra); --ok:var(--ink); --icon-idle:var(--ink-30);
  --script:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter','Noto Sans JP',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --mincho:'Shippori Mincho','Cormorant Garamond',Georgia,serif;
  --sp-xs:4px; --sp-sm:8px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px; --sp-xxl:56px;
  --shadow:0 1px 2px rgba(27,43,94,.06); --shadow-lg:0 20px 25px -5px rgba(27,43,94,.12),0 8px 10px -6px rgba(27,43,94,.1);
  --dotted:linear-gradient(to right,rgba(27,43,94,.2) 33%,rgba(255,255,255,0) 0%);
  color-scheme:light;
}

/* ---------- base ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#EBE6DC;color:var(--ink);font:300 15px/1.7 var(--mincho);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--ink);color:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
input,select,textarea{background:transparent;border:0;border-bottom:1px solid var(--ink-20);border-radius:0;padding:0;width:100%;min-width:0;font:300 15px/20px var(--mincho);transition:border-color .2s}
input,select{height:44px}
textarea{min-height:44px;padding:12px 0}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--ink)}
select{padding-right:20px}
textarea{resize:none}
input[type="checkbox"]{width:auto}
input[type="date"],input[type="time"],input[type="number"]{font-family:var(--sans);font-weight:300;font-size:14px}
input::placeholder,textarea::placeholder{color:var(--ink-30)}
.hidden,[hidden]{display:none!important}
a{color:inherit}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.grain{display:none}
.label{font:400 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-50)}
.rule::before{content:"";display:inline-block;width:32px;height:1px;background:var(--ink-30);margin-right:12px;vertical-align:middle}

#app{min-height:100dvh;display:flex;flex-direction:column}
.sheet{display:flex;flex-direction:column;flex:1}

/* ---------- a second skin, chosen per trip ----------
   Colour and type only: the board keeps every element, class and behaviour it has
   under the house style, so a trip can wear either without anything moving. */
body[data-theme="mono"]{
  --paper:#FAFAFA; --ink:#171717; --sand:#EBEBEB; --sky:#0075F5; --cream:#FFFFFF; --lemon:#FBBF24; --olive:#737373; --terra:#DC2626;
  --ink-80:rgba(23,23,23,.8); --ink-70:rgba(23,23,23,.62); --ink-60:rgba(23,23,23,.55); --ink-50:rgba(23,23,23,.45); --ink-40:rgba(23,23,23,.36); --ink-30:rgba(23,23,23,.28); --ink-20:rgba(23,23,23,.16); --ink-10:rgba(23,23,23,.09); --ink-05:rgba(23,23,23,.05);
  --bg:var(--paper); --panel:#FFFFFF; --panel-2:rgba(255,255,255,.6); --muted:#737373; --faint:rgba(23,23,23,.4); --line:rgba(23,23,23,.14); --line-soft:rgba(23,23,23,.07); --line-strong:var(--ink);
  --accent:var(--ink); --accent-soft:rgba(0,117,245,.1); --accent-ink:var(--paper); --danger:var(--terra); --ok:var(--ink); --icon-idle:rgba(23,23,23,.3);
  --script:'Homemade Apple',cursive;
  --sans:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --mincho:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.04); --shadow-lg:0 20px 25px -5px rgba(0,0,0,.08),0 8px 10px -6px rgba(0,0,0,.06);
  --dotted:linear-gradient(to right,rgba(23,23,23,.18) 33%,rgba(255,255,255,0) 0%);
  background:#FAFAFA;
}
/* The header is flat here, closed by a hairline with a light edge under it. */
body[data-theme="mono"] .top{background:#FAFAFA;border-bottom:1px solid var(--line);box-shadow:0 1px 0 0 rgba(255,255,255,.6)}
body[data-theme="mono"] .hero-pad{padding:64px 0 72px}
/* The handwritten face is for names only, and never slanted: it has no italic of its own. */
body[data-theme="mono"] .trip-name{font:400 52px/1.25 var(--script);letter-spacing:0}
body[data-theme="mono"] .bar-title{font:400 17px/1.3 var(--script)}
body[data-theme="mono"] .col-head .dow{font:400 22px/1.3 var(--script)}
body[data-theme="mono"] .unsched-title{font:400 20px/1.3 var(--script)}
body[data-theme="mono"] .ed-title{font:400 24px/1.35 var(--script)}
body[data-theme="mono"] .tut-title{font:400 21px/1.35 var(--script)}
body[data-theme="mono"] .pola figcaption{font:400 12px/20px var(--sans);letter-spacing:.04em}
body[data-theme="mono"] .trip-sub{font:400 13px/1.7 var(--sans);letter-spacing:.02em;color:var(--muted)}
body[data-theme="mono"] .trip-kicker{font-weight:700}
/* Small print carries the weight in this design. */
body[data-theme="mono"] .label,body[data-theme="mono"] .section-h{font-weight:700;letter-spacing:.18em}
/* Column headers are set small and bold here, the way the rest of the small print is. */
body[data-theme="mono"] .check-title{font:700 12px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase}
body[data-theme="mono"] .card-cat,body[data-theme="mono"] .col-head .date{font-weight:500}
body[data-theme="mono"] .title{font:400 14px/1.6 var(--mincho)}
/* Marks sit in tinted pills rather than plain small caps. */
body[data-theme="mono"] .card-res .st{background:var(--accent-soft);color:#0075F5;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:500}
body[data-theme="mono"] .card{border-radius:6px}
body[data-theme="mono"] .newcard,body[data-theme="mono"] .addday-btn,body[data-theme="mono"] .btn{border-radius:6px;font-weight:500}

/* ---------- undertone: black rules and type over a moving gradient ---------- */
#glbg{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;display:none}
body[data-theme="undertone"] #glbg{display:block}
body[data-theme="undertone"]{
  --paper:#FFFFFF; --ink:#000000; --sand:rgba(0,0,0,.08); --sky:#1d3557; --cream:#FFFFFF; --lemon:#e9c46a; --olive:#2a9d8f; --terra:#e85d04;
  --ink-80:rgba(0,0,0,.8); --ink-70:rgba(0,0,0,.7); --ink-60:rgba(0,0,0,.62); --ink-50:rgba(0,0,0,.55); --ink-40:rgba(0,0,0,.45); --ink-30:rgba(0,0,0,.35); --ink-20:rgba(0,0,0,.25); --ink-10:rgba(0,0,0,.14); --ink-05:rgba(0,0,0,.07);
  --bg:transparent; --panel:rgba(255,255,255,.28); --panel-2:rgba(255,255,255,.14); --muted:rgba(0,0,0,.62); --faint:rgba(0,0,0,.45); --line:#000000; --line-soft:rgba(0,0,0,.25); --line-strong:#000000;
  --accent:#000000; --accent-soft:rgba(0,0,0,.08); --accent-ink:#FFFFFF; --danger:var(--terra); --ok:#000; --icon-idle:rgba(0,0,0,.45);
  --script:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --mincho:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --shadow:none; --shadow-lg:0 24px 48px -12px rgba(0,0,0,.35);
  --dotted:linear-gradient(to right,rgba(0,0,0,.35) 33%,rgba(255,255,255,0) 0%);
  background:#111;
}
/* The frame is drawn in hairlines: one under the header, one over the foot. */
body[data-theme="undertone"] .top{background:transparent;border-bottom:1px solid #000;box-shadow:none}
body[data-theme="undertone"] .hero-pad{padding:56px 0 64px}
/* Display text is the same face as everything else, set tight and large. */
body[data-theme="undertone"] .trip-name{font:400 clamp(64px,10vw,150px)/1 var(--script);letter-spacing:-.035em;text-transform:capitalize}
body[data-theme="undertone"] .trip-sub{font:400 14px/1.3 var(--sans);letter-spacing:-.01em;color:#000;margin-top:14px}
body[data-theme="undertone"] .trip-kicker{font:500 12px/1.2 var(--sans);letter-spacing:.04em;margin-bottom:20px}
body[data-theme="undertone"] .bar-title{font:500 14px/1.2 var(--script);letter-spacing:-.01em}
body[data-theme="undertone"] .col-head .dow{font:400 28px/1.1 var(--script);letter-spacing:-.03em}
body[data-theme="undertone"] .unsched-title{font:400 22px/1.1 var(--script);letter-spacing:-.03em}
body[data-theme="undertone"] .ed-title{font:400 28px/1.15 var(--script);letter-spacing:-.03em}
body[data-theme="undertone"] .tut-title{font:400 24px/1.2 var(--script);letter-spacing:-.03em}
body[data-theme="undertone"] .check-title{font:500 12px/1.2 var(--sans);letter-spacing:.04em;text-transform:uppercase}
/* Every small line is uppercase, lightly tracked, and black. */
body[data-theme="undertone"] .label,body[data-theme="undertone"] .section-h,body[data-theme="undertone"] .status,
body[data-theme="undertone"] .col-head .date,body[data-theme="undertone"] .card-cat,body[data-theme="undertone"] .card-foot{letter-spacing:.04em;font-weight:500}
body[data-theme="undertone"] .title{font:400 15px/1.5 var(--mincho);letter-spacing:-.01em}
/* Columns are separated by the same hairline as the frame. */
body[data-theme="undertone"] .col{border-right:1px solid #000;padding:0 20px}
body[data-theme="undertone"] .board{gap:0}
body[data-theme="undertone"] .col-head{border-bottom:1px solid #000}
/* The checklist sits on the same frosted panel, carried further so it reads as a card. */
body[data-theme="undertone"] .checklist{background:rgba(255,255,255,.3);backdrop-filter:blur(40px) saturate(150%);-webkit-backdrop-filter:blur(40px) saturate(150%);border:1px solid #000}
body[data-theme="undertone"] .ucard{background:rgba(255,255,255,.24);border:1px solid #000}
body[data-theme="undertone"] .unsched-section{border-top:1px solid #000}
body[data-theme="undertone"] .newcard,body[data-theme="undertone"] .addday-btn,body[data-theme="undertone"] .btn{border:1px solid #000}
/* Nothing is painted behind the travel text. Where a travel row follows a card, the card gives
   up its dotted rule and the row draws it instead, in two runs either side of the text, so the
   gap around the words is a real gap rather than a patch. A day's first row keeps no rule. */
body[data-theme="undertone"] .link .addtr,body[data-theme="undertone"] .link .chip{background:transparent}
body[data-theme="undertone"] .card:has(+ .link){background-image:none}
body[data-theme="undertone"] .link .line,body[data-theme="undertone"] .link::after{
  background-image:var(--dotted);background-size:6px 1px;background-repeat:repeat-x;background-position:center}
body[data-theme="undertone"] .link::after{content:"";flex:1;height:20px}
body[data-theme="undertone"] .col-body>.link:first-child .line,body[data-theme="undertone"] .col-body>.link:first-child::after{background-image:none}
body[data-theme="undertone"] .col:last-child{border-right:none}
/* The tabs and everything below them ride on the design's half-opaque panel, blurred and
   lifted off the gradient, so the small type stays legible without flattening the colour. */
/* The tabs, the board and the ideas below it share the checklist's surface. It is painted on
   the one sheet that holds all three, because an element that blurs its own backdrop can only
   sample within itself, and three of them would meet at visible edges. */
body[data-theme="undertone"] .sheet{
  background:rgba(255,255,255,.3);
  backdrop-filter:blur(40px) saturate(150%);
  -webkit-backdrop-filter:blur(40px) saturate(150%);
}
body[data-theme="undertone"] .filters,body[data-theme="undertone"] .daynav{border-top:1px solid #000}
body[data-theme="undertone"] .unsched-section{margin:0;padding-left:var(--sp-xl);padding-right:var(--sp-xl)}
body[data-theme="undertone"] body,body[data-theme="undertone"]{background:#111}

/* ---------- hero (top area) ---------- */
.top{position:sticky;top:0;z-index:25;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 var(--sp-lg);background:linear-gradient(135deg,#87BADB 0%,#aee1f9 50%,#FAF3E0 100%);border-bottom:1px solid var(--ink-10);overflow:hidden}
.top:not(.stuck){position:relative}
.hero-collapsed .top{position:sticky}
.hero-drawer{display:grid;grid-template-rows:1fr;width:100%;transition:grid-template-rows .55s cubic-bezier(.4,0,.2,1),opacity .4s ease}
.hero-body{overflow:hidden;min-height:0}
.hero-pad{display:flex;flex-direction:column;align-items:center;position:relative;padding:96px 0 72px;padding-top:max(96px,calc(env(safe-area-inset-top) + 80px))}
.hero-collapsed .hero-drawer{grid-template-rows:0fr;opacity:0;pointer-events:none}
.bar{display:flex;justify-content:center;align-items:center;gap:12px;width:100%;height:0;opacity:0;overflow:hidden;transition:height .55s cubic-bezier(.4,0,.2,1),opacity .35s ease;position:relative;z-index:2}
.hero-collapsed .bar{height:58px;opacity:1}
.bar-title{font:300 italic 24px/1.2 var(--script);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100vw - 140px);padding:4px 0}
.bar-chev{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-60);transition:color .2s,transform .3s}
.bar-chev:hover{color:var(--ink)}
.bar-chev svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}
.hero-collapsed .top-row{padding-top:11px;padding-bottom:11px}
.top::before{content:"";position:absolute;inset:0;opacity:.3;pointer-events:none;background-image:radial-gradient(circle,#fff 0,#fff 3px,transparent 4px),radial-gradient(circle,#fff 0,#fff 4px,transparent 5px),radial-gradient(circle,#fff 0,#fff 2px,transparent 3px),radial-gradient(circle,#fff 0,#fff 3px,transparent 4px);background-repeat:no-repeat;background-position:30% 20%,70% 40%,20% 60%,60% 75%;filter:blur(1px)}
.top-row{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-md);padding:22px var(--sp-xl);padding-top:max(22px,env(safe-area-inset-top));z-index:2}
.trip-btn{display:inline-flex;align-items:center;gap:8px;font:400 11px/1 var(--sans);letter-spacing:.25em;text-transform:uppercase;color:var(--ink-60);border-bottom:1px solid transparent;padding-bottom:4px;transition:color .2s,border-color .2s}
.trip-btn:hover{color:var(--ink);border-bottom-color:var(--ink)}
.trip-btn .ring{display:inline-flex;align-items:center;justify-content:center}
.trip-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5}
.top-actions{display:flex;align-items:center;gap:var(--sp-md);flex:none}
.status{cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--ink-50);font:400 9px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;white-space:nowrap}
.status .dot{width:5px;height:5px;border-radius:50%;background:var(--ink-30)}
.status.ok .dot{background:var(--ink)}
.status.busy .dot{background:var(--terra);animation:pulse 1s infinite}
.status.err{color:var(--terra)} .status.err .dot{background:var(--terra)}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:36px;height:36px;border:1px solid var(--ink-20);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);transition:background .5s,color .5s,border-color .5s}
.iconbtn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.iconbtn svg{width:16px;height:16px}
.trip-header{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;margin:0;animation:fadeup .8s ease-out both}
@keyframes fadeup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.trip-kicker{font:400 11px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;opacity:.7;margin-bottom:28px}
.trip-name{font:300 italic 96px/.9 var(--script);letter-spacing:-.01em;display:block;text-wrap:balance;margin:0}
.trip-name em{font-style:italic;display:inline;margin:0}
.trip-sub{font:300 24px/1.3 var(--script);letter-spacing:.05em;color:var(--ink);margin-top:20px;max-width:640px}
.filters{display:flex;gap:var(--sp-md);padding:var(--sp-lg) var(--sp-xl) 0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;font:400 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:0;border-bottom:2px solid transparent;padding:8px 20px;font:inherit;color:var(--ink-50);background:none;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;transition:color .2s,border-color .2s;min-height:44px}
.fchip:hover{color:var(--ink)}
.fchip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.fchip .n{opacity:.5}

.daynav{display:none;align-items:center;justify-content:space-between;gap:12px;padding:16px var(--sp-lg) 4px}
.daynav-btn{width:44px;height:44px;border:1px solid var(--ink-20);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none;transition:background .3s,color .3s}
.daynav-btn:disabled{opacity:.25}
.daynav-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5}
.daynav-pick{flex:1;height:44px;border:0;border-bottom:1px solid var(--ink-20);background:transparent;font:400 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);text-align:center;text-align-last:center;padding:0 8px;appearance:none;-webkit-appearance:none}
/* ---------- board (timeline) ---------- */
.main{flex:1;display:flex;align-items:flex-start;position:relative;padding-top:var(--sp-lg)}
.board{flex:1;min-width:0;overflow-x:auto;display:flex;gap:48px;padding:var(--sp-lg) var(--sp-xl) 96px;align-items:flex-start;scroll-snap-type:x proximity;scroll-padding-left:var(--sp-xl);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.board::-webkit-scrollbar{display:none}
.col{flex:0 0 360px;width:360px;display:flex;flex-direction:column;scroll-snap-align:start;position:relative;transition:background .15s;padding:0 4px}
.col.drop{background:rgba(135,186,219,.18)}
.col-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-sm);padding-bottom:16px;border-bottom:1px solid var(--ink-20);margin-bottom:32px}
.col-head .dow{font:400 36px/1.1 var(--script)}
.col-head .sub{font:400 11px/1.4 var(--sans);letter-spacing:.1em;color:var(--ink-50);margin-top:4px}
.col-head .date{font:400 10px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-60)}
.col-head .right{display:flex;align-items:center;gap:var(--sp-sm)}
.col-head .cnt{display:none}
.col-head .menu{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-40)}
.col-head .menu:hover{color:var(--ink)}
.col-head .menu svg{width:16px;height:16px}
.col-body{flex:none;display:flex;flex-direction:column;position:relative}
.col.unsched .col-head .dow{color:var(--ink-50);font-style:italic}
.col.addday{flex-basis:220px;width:220px}
.col.addday .col-head{border-bottom-color:transparent}
.addday-btn,.newcard{display:inline-flex;align-items:center;gap:10px;color:var(--ink);padding:14px 28px;border:1px solid var(--ink);font:400 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;width:fit-content;background:transparent;transition:background .5s,color .5s;min-height:44px}
.addday-btn:hover,.newcard:hover{background:var(--ink);color:var(--paper)}
.newcard{margin-top:var(--sp-lg);margin-left:88px}
.addday-btn svg,.newcard svg{width:12px;height:12px}
.empty-col{color:var(--ink-60);font:300 14px/1.7 var(--mincho);padding:0 0 var(--sp-md) 88px}

/* timeline items: time column + details, dotted rule under each */
.card{display:flex;gap:24px;position:relative;padding:0 0 24px;cursor:pointer;user-select:none;-webkit-user-select:none;background-image:var(--dotted);background-position:bottom;background-size:6px 1px;background-repeat:repeat-x;margin-bottom:24px;transition:opacity .2s}
.card:hover{opacity:.7}
.card.dragging{opacity:.35}
.card.ghost{position:fixed;z-index:100;pointer-events:none;background:var(--paper);box-shadow:var(--shadow-lg);padding:var(--sp-md);opacity:.98;cursor:grabbing;transform-origin:center;background-image:none}
.card.archived{opacity:.45}
.card.archived .title{text-decoration:line-through}
.time-col{width:64px;flex:none;text-align:left;padding-top:3px}
.time{font:400 11px/1.4 var(--sans);letter-spacing:.1em;color:var(--ink-50)}
.details{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card-cat{align-self:flex-start;display:inline-flex;align-items:center;line-height:1;gap:8px;font:400 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-50);margin-bottom:4px;padding:0;background:none}
.card-cat::before{content:"";width:8px;height:8px;margin:0 4px;box-sizing:border-box;border-radius:50%;background:var(--cat,var(--sand));border:1px solid var(--ink-05);box-shadow:var(--shadow)}
.card-cat i{display:none}
.card-head{display:flex;align-items:center;gap:8px}
.card-emoji{font-size:15px;line-height:1;flex:none;font-family:system-ui;transform:translateY(1px)}
.card-emoji.none{display:none}
.title{font:400 16px/1.5 var(--mincho);flex:1;min-width:0;overflow-wrap:anywhere}
.title.untitled{color:var(--ink-40)}
.grip{position:absolute;right:0;top:0;width:28px;height:28px;color:var(--ink-30);display:inline-flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.grip:hover{color:var(--ink)}
.grip svg{width:14px;height:14px}
.card-res{font:300 13px/1.6 var(--mincho);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;color:var(--ink-70)}
.card-res .st{font:400 10px/1.6 var(--sans);letter-spacing:.15em;text-transform:uppercase}
.card-res.booked .st{color:var(--ink-50)}
.card-res.open .st{color:var(--terra);border-bottom:1px solid var(--terra)}
.card-res.walkin .st{color:var(--olive)}
.card-res .det{overflow-wrap:anywhere}
.card-meta{display:flex;flex-wrap:wrap;gap:var(--sp-sm);align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font:400 11px/1 var(--sans);letter-spacing:.05em;padding:0;white-space:nowrap;background:none;color:var(--ink)}
.chip.tone{background:none;color:var(--ink)}
.chip.est::after{content:"est.";font-size:9px;opacity:.6;margin-left:2px}
.stars{font-size:12px;letter-spacing:2px;color:var(--lemon)}
.note{display:flex;gap:8px;font:300 13px/1.6 var(--mincho);color:var(--ink-70);align-items:baseline}
.note .who{flex:none;font:400 10px/1.6 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-50)}
.note .who::after{content:"·";margin-left:6px}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.card-foot{display:flex;flex-wrap:wrap;gap:var(--sp-md);font:400 10px/1.6 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-50);align-items:center}
.card-foot .chip{background:none;padding:0;font:inherit;color:inherit}
.card-foot .outfit{display:inline-flex;gap:4px;align-items:center;overflow-wrap:anywhere;text-transform:none;letter-spacing:0;font:300 13px/1.6 var(--mincho);color:var(--ink-70)}
.action-link{display:inline-flex;align-items:center;gap:8px;font:400 11px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--ink);text-decoration:none;margin-top:var(--sp-sm);padding:0 0 4px;border-bottom:1px solid var(--ink);width:fit-content;background:transparent;transition:opacity .2s;min-height:0}
.action-link svg{width:12px;height:12px;stroke-width:1.5}
.action-link:hover{opacity:.6}

/* travel-time row between two items */
/* the travel text sits on the dotted divider under the previous stop, at the same x as the stop's text */
.link{display:flex;gap:24px;min-height:20px;align-items:center;margin:-34px 0 14px;position:relative;z-index:1}
.link .line{width:64px;flex:none;height:20px}
.col-body>.link:first-child{margin-top:0;margin-bottom:10px}
.link .chip{background:var(--paper);padding:0 8px;margin-left:-8px;font:400 10px/20px var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-50);gap:0 6px;flex-wrap:wrap;white-space:normal;max-width:100%}
.chip .opt{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .sep{opacity:.6}
.chip .mi{display:inline-flex;width:16px;justify-content:center;flex:none;font-family:system-ui;font-size:13px;line-height:1}
.link .chip[role="button"],.link a.chip{cursor:pointer;text-decoration:none}
.link .chip[role="button"]:hover,.link a.chip:hover{color:var(--ink)}
.link .addtr{color:var(--ink-40);font:300 12px/20px var(--mincho);opacity:1;padding:0 8px;margin-left:-8px;text-align:left;background:var(--paper)}
.link .addtr:hover{color:var(--ink)}
.gap{height:0}

/* ---------- unscheduled ideas, under the board ---------- */
.unsched-section{border-top:1px solid var(--ink-20);margin:0 var(--sp-xl);padding:40px 0 96px}
.unsched-section.drop{background:rgba(135,186,219,.18)}
.unsched-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-md);margin-bottom:28px}
.unsched-head .newcard{margin:0}
.unsched-title{font:400 30px/1.1 var(--script);margin:6px 0 0}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.ucard{position:relative;border:1px solid var(--ink-20);padding:20px 40px 20px 20px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:rgba(255,255,255,.3);transition:border-color .2s,opacity .2s;min-height:96px}
.ucard:hover{border-color:var(--ink)}
.ucard.dragging{opacity:.35}
.ucard.archived{opacity:.45}
.ucard .grip{top:12px;right:8px}
.ucard.ghost{position:fixed;z-index:100;pointer-events:none;background:var(--paper);box-shadow:var(--shadow-lg);opacity:.98}
.ugrid .empty-col{grid-column:1/-1;padding:0}
/* ---------- editor popover ---------- */
.editor{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 40px);z-index:40;background:var(--paper);border:1px solid var(--ink-10);box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden}
.editor.open{display:flex}
.backdrop{display:none;position:fixed;inset:0;background:rgba(27,43,94,.35);z-index:30}
.backdrop.open{display:block}
.ed-top{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-lg) var(--sp-lg) 0 var(--sp-xl);flex:none}
.ed-top .day{font:400 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-50)}
.ed-scroll{flex:1;min-height:0;max-height:calc(100dvh - 102px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:var(--sp-sm) var(--sp-xl) var(--sp-xl);scrollbar-width:none}
.ed-scroll::-webkit-scrollbar{display:none}
.ed-hero{display:flex;gap:var(--sp-md);align-items:center;margin:var(--sp-md) 0 var(--sp-lg);padding-bottom:var(--sp-md);border-bottom:1px solid var(--ink-20)}
.emoji-btn{width:48px;height:48px;border:1px solid var(--ink-20);font-size:24px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none;background:rgba(255,255,255,.4);font-family:system-ui}
.emoji-btn.has{background:rgba(255,255,255,.6)}
.ed-title{font:300 italic 40px/1 var(--script);background:none;border:0;padding:6px 0}
.ed-title:focus{border-color:transparent}
.emoji-pop{position:fixed;z-index:50;background:var(--paper);border:1px solid var(--ink-20);box-shadow:var(--shadow-lg);padding:12px;width:296px}
.emoji-pop input{margin-bottom:8px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emoji-grid button{font-size:20px;height:32px;font-family:system-ui}
.emoji-grid button:hover{background:rgba(255,255,255,.5)}
.prop{display:grid;grid-template-columns:140px 1fr;gap:var(--sp-md);align-items:start;padding:12px 0;min-height:44px;border-bottom:1px solid var(--ink-10)}
.prop:last-of-type{border-bottom:0}
.prop-k{display:flex;align-items:center;gap:8px;color:var(--ink-50);font:400 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;height:44px;white-space:nowrap;min-width:0}
.prop-k span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.prop-k svg{width:13px;height:13px;flex:none;stroke-width:1.5;opacity:.7}
.prop-v{min-width:0}
.prop-v .row{display:flex;gap:16px;align-items:center}
.prop-v .row input[type="number"]{width:88px;flex:none}
.switch{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0;cursor:pointer}
.switch input{appearance:none;width:34px;height:18px;border-radius:999px;background:var(--ink-20);position:relative;margin:0;padding:0;border:0;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--paper);transition:left .15s}
.switch input:checked{background:var(--ink)}
.switch input:checked::after{left:18px}
.switch span{font:300 14px/1.5 var(--mincho);color:var(--ink-70)}
.rating{display:flex;gap:2px;height:44px;align-items:center;padding:0}
.rating button{font-size:20px;line-height:1;color:var(--ink-20);padding:2px}
.rating button.on{color:var(--lemon)}
.rating .clear{font:400 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-50);margin-left:8px;align-self:center;border-bottom:1px solid var(--ink-30)}
.ed-foot{display:flex;gap:16px;padding:var(--sp-lg) 0 0;border-top:1px solid var(--ink-20);margin-top:var(--sp-lg)}
.btn{border:1px solid var(--ink);background:transparent;padding:14px 28px;font:400 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px;color:var(--ink);transition:background .5s,color .5s;min-height:44px}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:transparent;color:var(--ink)}
.btn.primary:disabled{opacity:.35;cursor:default;background:var(--ink);color:var(--paper)}
.btn.danger{color:var(--terra);border-color:var(--ink-20)}
.btn.danger:hover{background:var(--terra);color:var(--paper);border-color:var(--terra)}
.btn svg{width:12px;height:12px}
.ed-hint{color:var(--ink-60);font:300 12px/1.6 var(--mincho);margin-top:6px}

/* ---------- segmented controls & forms ---------- */
.seg{display:flex;flex-wrap:wrap;gap:4px 8px;font:400 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.seg button{border:0;border-bottom:2px solid transparent;background:transparent;padding:0 12px;font:inherit;color:var(--ink-50);display:inline-flex;gap:6px;align-items:center;transition:color .2s,border-color .2s;height:44px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.suggest-wrap{position:relative}
.suggest{position:absolute;left:0;right:0;top:calc(100% - 18px);background:var(--paper);border:1px solid var(--ink-20);box-shadow:var(--shadow-lg);z-index:60;max-height:264px;overflow-y:auto;padding:4px 0}
.suggest button{display:block;width:100%;text-align:left;padding:10px 14px;font:300 15px/1.4 var(--mincho);border-bottom:1px solid var(--ink-05)}
.suggest button .sec{display:block;font:400 10px/1.6 var(--sans);letter-spacing:.05em;color:var(--ink-50)}
.suggest button[aria-selected="true"],.suggest button:hover{background:rgba(255,255,255,.5)}
.place-line{display:flex;gap:6px;align-items:flex-start;font:300 12px/1.6 var(--mincho);color:var(--ink-60);margin-top:6px;min-height:16px}
.place-line .addr{flex:1;min-width:0;overflow-wrap:anywhere}
.place-line .clr{color:var(--ink-40);padding:0 4px}
.place-line .clr:hover{color:var(--terra)}
.place-line.busy{color:var(--ink)}
.place-line.warn{color:var(--terra)}
.auto-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:44px;padding:0}
.auto-line .chip{background:none;padding:0;font:400 11px/1.6 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--ink)}
.auto-line .why{color:var(--ink-60);font:300 12px/1.6 var(--mincho)}
.section-h{font:400 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-50);margin-top:16px}
.dlg .prop{grid-template-columns:130px 1fr}
dialog.tut-dlg{width:min(560px,calc(100vw - 24px))}
dialog.tut-dlg .dlg{overflow:hidden;padding:28px 32px 24px;gap:0;scrollbar-width:none}
dialog.tut-dlg .dlg::-webkit-scrollbar{display:none}
.tut{display:flex;flex-direction:column;gap:20px;min-height:560px}
.tut-page{display:flex;flex-direction:column;gap:14px;flex:1}
.tut-page .label{display:flex;align-items:center}
.tut-page .label.rule{justify-content:flex-start}
.tut-title{font:300 italic 34px/1.1 var(--script);margin:0}
.tut-title.big{font-size:60px;text-align:center;margin:10px 0 6px}
.tut-body{font:300 15px/1.8 var(--mincho);color:var(--ink-80);margin:0}
.pola{margin:6px auto 10px;width:100%;max-width:420px;background:#fff;padding:10px 10px 34px;border:1px solid var(--ink-05);box-shadow:0 2px 6px rgba(27,43,94,.12)}
.pola img{display:block;width:100%;height:210px;object-fit:cover;object-position:top}
.pola figcaption{text-align:center;font:400 italic 15px/24px var(--script);color:var(--ink-80);margin-top:4px}
.tut-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:12px;border-top:1px solid var(--ink-10)}
.tut-link{display:inline-flex;align-items:center;gap:8px;font:400 11px/1 var(--sans);letter-spacing:.25em;text-transform:uppercase;color:var(--ink-60);padding:12px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s;min-height:44px}
.tut-link:hover{color:var(--ink);border-bottom-color:var(--ink)}
.tut-link:disabled{opacity:.25;cursor:default}
.tut-link svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5}
.dots{display:flex;gap:8px}
.dots .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-20);transition:background .2s}
.dots .dot.on{background:var(--ink)}
.tut-dont{display:flex;justify-content:flex-end;align-items:center;gap:10px;font:400 10px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-50);cursor:pointer;margin-top:-6px}
.tut-dont input{appearance:none;width:14px;height:14px;border:1px solid var(--ink-30);margin:0;cursor:pointer;background:transparent}
.tut-dont input:checked{background:var(--ink);border-color:var(--ink)}
@media (max-width:760px){.tut{min-height:0}.tut-title{font-size:30px}.tut-title.big{font-size:48px}.pola img{height:170px}dialog.tut-dlg .dlg{padding:22px 20px 18px}.tut-body{font-size:14px}}

/* ---------- a card's three tabs: details, images, links ---------- */
.ed-tabs{display:flex;gap:var(--sp-lg);border-bottom:1px solid var(--ink-10);margin:0 0 var(--sp-sm);font:400 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase}
.ed-tabs button{padding:12px 2px;color:var(--ink-50);border-bottom:2px solid transparent;transition:color .2s,border-color .2s;min-height:44px}
.ed-tabs button:hover{color:var(--ink)}
.ed-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.ed-tabs .n{opacity:.45;margin-left:6px}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:var(--sp-md) 0}
.img-cell{position:relative;aspect-ratio:1;overflow:hidden;border:1px solid var(--ink-10);background:var(--panel-2)}
.img-cell img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.img-del{position:absolute;top:4px;right:4px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;background:var(--paper);border:1px solid var(--ink-20);color:var(--ink);opacity:0;transition:opacity .2s}
.img-cell:hover .img-del,.img-del:focus-visible{opacity:1}
.img-del svg{width:12px;height:12px}
.img-tag{position:absolute;left:0;bottom:0;padding:3px 6px;background:var(--paper);color:var(--ink-60);font:400 9px/1 var(--sans);letter-spacing:.15em;text-transform:uppercase}
.img-cell.broken{background:repeating-linear-gradient(45deg,var(--ink-05),var(--ink-05) 6px,transparent 6px,transparent 12px)}
.img-cell.broken img{opacity:0}
.img-drop{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 20px;border:1px dashed var(--ink-20);text-align:center;transition:border-color .2s,background .2s}
.img-drop.over{border-color:var(--ink);background:var(--panel-2)}
.img-note{color:var(--ink-60);font:300 12px/1.7 var(--mincho);margin-top:var(--sp-md)}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:var(--shadow-lg)}
.link-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.link-ico{width:28px;height:28px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-30);transition:color .2s}
.link-ico.on{color:var(--ink)}
.link-ico svg{width:19px;height:19px}
.link-open{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-40);border:1px solid transparent;transition:color .2s,border-color .2s}
.link-open:hover{color:var(--ink);border-color:var(--ink-20)}
.link-open svg{width:14px;height:14px}
.link-open[hidden]{display:none}
@media (max-width:760px){.img-grid{gap:6px}.ed-tabs{gap:var(--sp-md);letter-spacing:.12em}}

/* ---------- popover / dialogs ---------- */
.pop{position:fixed;z-index:50;background:var(--paper);border:1px solid var(--ink-20);box-shadow:var(--shadow-lg);padding:6px 0;min-width:240px;max-width:min(320px,calc(100vw - 24px))}
.pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:12px 16px;font:300 14px/1.4 var(--mincho);border-bottom:1px solid var(--ink-05)}
.pop button:last-child{border-bottom:0}
.pop button:hover{background:rgba(255,255,255,.5)}
.pop button.danger{color:var(--terra)}
.pop button .chk{width:16px;flex:none;color:var(--ink);text-align:center}
.pop hr{border:0;border-top:1px dotted var(--ink-30);margin:6px 16px}
.pop .lbl{font:400 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-50);padding:12px 16px 6px}
dialog{background:var(--paper);color:var(--ink);border:1px solid var(--ink-10);border-radius:0;padding:0;width:min(600px,calc(100vw - 24px));box-shadow:var(--shadow-lg);max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(27,43,94,.4)}
.dlg{padding:var(--sp-xl);display:flex;flex-direction:column;gap:var(--sp-md);max-height:calc(100dvh - 40px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.dlg h2{font:300 italic 44px/1 var(--script);margin:0}
.dlg p{margin:0;color:var(--ink-60);font:300 13px/1.7 var(--mincho)}
.field{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.field label{font:400 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-50);border-bottom:1px solid var(--ink-10);padding-bottom:8px}
.field .hint{font:300 12px/1.6 var(--mincho);color:var(--ink-60)}
.fields-2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.dlg-actions{display:flex;justify-content:flex-end;gap:16px;margin-top:16px}
.catrow{display:grid;grid-template-columns:52px 1fr 36px;gap:12px;align-items:center}
.catrow input.em{text-align:center;font-size:18px;padding:5px;font-family:system-ui}
.catrow .del,.stayrow .del{color:var(--ink-30);width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center}
.catrow .del:hover,.stayrow .del:hover{color:var(--terra)}
.catlist{display:flex;flex-direction:column;gap:8px}
.stayrow{display:grid;grid-template-columns:1fr 1fr 1fr 36px;gap:12px;align-items:center}
.hotelrow{display:flex;flex-direction:column;gap:4px;padding-bottom:6px}
.hotelrow .hint{font-size:12px}
@media (max-width:760px){.stayrow{grid-template-columns:1fr 36px}.stayrow input[type="date"]{grid-column:1}}

/* ---------- bottom nav (phones) ---------- */
.bottom-nav{display:none;justify-content:space-around;align-items:center;padding:12px var(--sp-md);padding-bottom:max(12px,env(safe-area-inset-bottom));background:rgba(235,230,220,.9);backdrop-filter:blur(4px);border-top:1px solid var(--ink-10);position:sticky;bottom:0;z-index:20}
.nav-item{display:flex;justify-content:center;align-items:center;width:48px;height:44px;color:var(--ink);transition:all .2s}
.nav-item svg{width:20px;height:20px;fill:var(--ink-30)}
.nav-item.active svg{fill:var(--ink)}

/* empty / loading */
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--sp-xxl) var(--sp-lg)}
.hello{max-width:520px;display:flex;flex-direction:column;gap:var(--sp-lg);align-items:center;text-align:center}
.hello h1{font:300 italic 72px/.9 var(--script);margin:0;text-wrap:balance}
.hello p{color:var(--ink-70);margin:0;font:300 15px/1.8 var(--mincho)}

/* planner checklist in the hero */
.checklist{position:relative;z-index:1;width:100%;max-width:1100px;margin:48px auto 0;background:rgba(255,255,255,.3);border:1px solid var(--ink-10);padding:28px 32px 32px;text-align:left}
.checklist>.label{display:flex;align-items:center;margin-bottom:28px}
.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 48px}
.check-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--ink-20);margin-bottom:8px}
.check-title{font:400 30px/1.1 var(--script);margin:0}
.check-box{width:14px;height:14px;flex:none;border:1px solid var(--ink-30);display:inline-flex;align-items:center;justify-content:center;color:var(--paper);background:transparent;transition:background .3s,border-color .3s}
.check-box svg{width:10px;height:10px}
.check-day.done .check-box{background:var(--ink);border-color:var(--ink)}
.check-day.done{cursor:default}
.check-day.done:hover{opacity:1}
.check-day.done .check-date{color:var(--ink-50)}
.check-day .check-date{flex:1}
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.confetti{position:absolute;width:8px;height:8px;animation:confetti-fall 4s linear forwards}
@keyframes confetti-fall{0%{transform:translateY(-10vh) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:0}}
.check-count{font:400 10px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-60);white-space:nowrap}
.check-list{list-style:none;margin:0;padding:0}
.check-list li{background-image:var(--dotted);background-position:bottom;background-size:6px 1px;background-repeat:repeat-x}
.check-day{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 0;transition:opacity .2s;min-height:44px;color:inherit}
.check-day:hover{opacity:.6}
.check-date{font:400 11px/1.4 var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--ink)}
.check-city{font:300 13px/1.4 var(--mincho);color:var(--ink-60)}
.check-done{font:300 13px/1.6 var(--mincho);color:var(--ink-60);padding:14px 0;background-image:none}
/* scroll cue and the collapsed header bar (phones) */
.scroll-cue{display:flex;position:relative;margin-top:36px;flex-direction:column;align-items:center;gap:8px;opacity:.5;color:var(--ink);font:400 9px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;animation:bounce 1s infinite;z-index:2;padding:8px;min-width:44px;min-height:44px}
/* The tracked text carries an empty letter-space after the last character, inside its box.
   Centring the box therefore leaves the letters sitting left of the arrow; half that space,
   added as a left margin, puts the ink back over the centre. */
.scroll-cue span{margin-left:.3em}
.scroll-cue svg{width:14px;height:14px}
@keyframes bounce{0%,100%{transform:translateY(-25%);animation-timing-function:cubic-bezier(.8,0,1,1)}50%{transform:translateY(0);animation-timing-function:cubic-bezier(0,0,.2,1)}}
.trip-name[role="button"]{cursor:pointer}
/* ---------- phones ---------- */
@media (max-width:760px){
  .hero-collapsed .top-row{display:none}
  .hero-collapsed .bar{padding-top:env(safe-area-inset-top);height:calc(58px + env(safe-area-inset-top))}
  .checklist{margin-top:40px;padding:22px 20px 24px}
  .check-grid{grid-template-columns:1fr;gap:32px 0}
  .top{padding:0 var(--sp-md)}
  .hero-pad{padding:88px 0 64px}
  .top-row{padding:18px var(--sp-lg)}
  .top-actions .iconbtn{display:none}
  .status .txt{display:none}
  .trip-name{font-size:64px}
  .trip-sub{font-size:18px}
  .filters{display:none}
  .daynav{display:flex}
  .main{padding-top:var(--sp-sm)}
  .board{gap:24px;padding:var(--sp-md) var(--sp-lg) var(--sp-xxl);scroll-snap-type:x mandatory;scroll-padding-left:var(--sp-lg)}
  .col{flex-basis:calc(100vw - 48px);width:calc(100vw - 48px)}
  .col.addday{flex-basis:180px;width:180px}
  .col-head .dow{font-size:30px}
  .newcard{margin-left:0}
  .unsched-section{margin:0 var(--sp-lg);padding:32px 0 72px}
  .ugrid{grid-template-columns:1fr}
  .empty-col{padding-left:0}
  .editor{width:calc(100vw - 16px);max-height:calc(100dvh - 24px)}
  .ed-scroll{max-height:calc(100dvh - 86px);padding:var(--sp-xs) var(--sp-lg) calc(var(--sp-lg) + env(safe-area-inset-bottom))}
  .prop,.dlg .prop{grid-template-columns:1fr;gap:6px}
  .prop-k{height:auto;padding:0 0 2px}
  .dlg{padding:var(--sp-lg)}
  .dlg h2{font-size:36px}
  input[type="text"],textarea{font-size:16px}
}
@media (max-width:400px){.trip-name{font-size:52px}}
</style>
</head>
<body>

  <header class="top" id="top"></header>

  <div class="filters" id="filters"></div>
  <div class="daynav" id="daynav" aria-label="Day"></div>
  <div class="main">
    <div class="board" id="board"></div>
  </div>
  <section class="unsched-section" id="unsched" aria-label="Unscheduled ideas" data-drop=""></section>
  </div>
  <nav class="bottom-nav" id="bottomnav" aria-label="Quick actions"></nav>
</div>
<div class="backdrop" id="backdrop"></div>
<aside class="editor" id="editor" aria-label="Card details"></aside>
<div class="grain" aria-hidden="true"></div>
<dialog id="dlg"></dialog>

/* ================= storage backends ================= */
class LocalStore {
  constructor() {
    this.key = 'bookshelf-of-memories/v1';
    this.data = this.read();
    this.tripCb = null; this.evCb = null; this.evTrip = null;
    window.addEventListener('storage', e => {
      if (e.key !== this.key) return;
      this.data = this.read();
      this.tripCb && this.tripCb(Object.values(this.data.trips));
      this.evCb && this.evCb(Object.values(this.data.events[this.evTrip] || {}));
    });
  }

  watchTrips(cb) { this.tripCb = cb; cb(Object.values(this.data.trips)); return () => { this.tripCb = null; }; }
  watchEvents(tripId, cb) { this.evCb = cb; this.evTrip = tripId; cb(Object.values(this.data.events[tripId] || {})); return () => { this.evCb = null; }; }
  async saveTrip(t) { this.data.trips[t.id] = t; this.persist(); }
  async deleteTrip(id) { delete this.data.trips[id]; delete this.data.events[id]; this.persist(); }
  async saveEvent(tripId, ev) { (this.data.events[tripId] ||= {})[ev.id] = ev; this.persist(); }
  async deleteEvent(tripId, id) { delete (this.data.events[tripId] || {})[id]; this.persist(); }
}
class DbStore {
  constructor(db) { this.db = db; }

    try { return await fn(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return fn(); }
      throw e;
    }
  }
  watchTrips(cb, err) { return this.db.collection('trips').onSnapshot(s => cb(s.docs.filter(d => d.exists).map(d => d.data())), err); }
  watchEvents(tripId, cb, err) { return this.db.collection('trips/' + tripId + '/events').onSnapshot(s => cb(s.docs.filter(d => d.exists).map(d => d.data())), err); }
  saveTrip(t) { return this.retry(() => this.db.doc('trips/' + t.id).set(clone(t))); }
  async deleteTrip(id) {
    const evs = await this.db.collection('trips/' + id + '/events').get();
    for (const d of evs.docs) await this.db.doc('trips/' + id + '/events/' + d.id).delete();
    await this.retry(() => this.db.doc('trips/' + id).delete());
  }
  saveEvent(tripId, ev) { return this.retry(() => this.db.doc('trips/' + tripId + '/events/' + ev.id).set(clone(ev))); }
  deleteEvent(tripId, id) { return this.retry(() => this.db.doc('trips/' + tripId + '/events/' + id).delete()); }
}

  keep(fn) { if (this.mirror) Promise.resolve(fn()).catch(e => console.warn('device copy', e)); }

  async putImage(im) {
    const r = await fetch(this.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ op: 'putImage', name: im.name, data: im.data }), redirect: 'follow' });

  deleteTrip(id) { delete this.data.trips[id]; delete this.data.events[id]; this.keep(() => this.mirror.deleteTrip(id)); return this.send({ op: 'deleteTrip', id }); }
  saveEvent(tripId, ev) { (this.data.events[tripId] ||= {})[ev.id] = ev; this.keep(() => this.mirror.saveEvent(tripId, ev)); return this.send({ op: 'set', kind: 'event', tripId, id: ev.id, data: ev }); }

  const travelers = t.travelers.length ? t.travelers : ['Notes'];
  const noteRows = travelers.map(who => {
    const ta = el('textarea', { rows: 1, value: (ev.notes || {})[who] || '', placeholder: who === 'Notes' ? 'Notes' : `What ${who} wants to remember`,
      oninput: e => { patchEvent(ev.id, { notes: { ...(S.events[ev.id].notes || {}), [who]: e.target.value } }); autosize(e.target); }, onblur: () => flushEvent(ev.id) });
    requestAnimationFrame(() => autosize(ta));
    return prop('person', who === 'Notes' ? 'Notes' : `${who}'s notes`, ta);
  });

  const rating = el('div', { class: 'rating' },
    [1, 2, 3, 4, 5].map(n => el('button', { class: n <= ev.rating ? 'on' : '', 'aria-label': `${n} star${n > 1 ? 's' : ''}`, onclick: () => patchEvent(ev.id, { rating: ev.rating === n ? 0 : n }, { immediate: true }) }, '★')),
    ev.rating ? el('button', { class: 'clear', onclick: () => patchEvent(ev.id, { rating: 0 }, { immediate: true }) }, 'Clear') : null);

  const date = el('input', { type: 'date', value: ev.date, onchange: e => { const v = e.target.value; patchEvent(ev.id, { date: v }, { immediate: true }); if (v && !t.days.includes(v)) addDay(t, v); } });
  const time = el('input', { type: 'time', value: ev.time, onchange: e => patchEvent(ev.id, { time: e.target.value }, { immediate: true }) });

  // Transportation: automatic from directions, with a manual override.
  const tr = ev.transport || { mins: null, mode: '' };
  const manual = !!(tr.mins || tr.mode);
  const autoLine = el('div', { class: 'auto-line', id: 'f-transport' });
  if (ev.auto && ev.auto.mode) autoLine.append(transportChip(ev.auto), el('span', { class: 'why' }, ev.auto.est ? 'estimated from the two map pins' : ev.auto.src === 'osm' ? 'OpenStreetMap route' : 'Google Maps directions'),
    ...(manual ? [el('span', { class: 'why' }, tr.override ? '· overridden below' : '· replaces the hand-entered time below')] : []));
  else if (!hasCoords(ev)) autoLine.append(el('span', { class: 'why' }, 'Add a Google Maps link to this card and the one before it to get the travel time here.'));
  else autoLine.append(el('span', { class: 'why' }, 'Waiting for a located card before this one.'));
  const mins = el('input', { type: 'number', min: 0, step: 1, inputmode: 'numeric', placeholder: 'min', value: tr.mins ?? '',
    oninput: e => patchEvent(ev.id, { transport: { ...S.events[ev.id].transport, override: true, mins: e.target.value === '' ? null : Math.max(0, parseInt(e.target.value, 10) || 0) } }), onblur: () => flushEvent(ev.id) });
  const mode = el('select', { onchange: e => patchEvent(ev.id, { transport: { ...S.events[ev.id].transport, override: true, mode: e.target.value } }, { immediate: true }) },
    el('option', { value: '' }, 'How?'), Object.entries(MODES).map(([k, m]) => el('option', { value: k, selected: k === tr.mode }, `${m.icon} ${m.label}`)));
  const clearManual = manual ? el('button', { class: 'btn', style: 'margin-top:8px', onclick: () => patchEvent(ev.id, { transport: { mins: null, mode: '' } }, { immediate: true }) }, 'Use directions instead') : null;

  const outfit = el('textarea', { rows: 1, value: ev.outfit || '', placeholder: 'What to wear', oninput: e => { patchEvent(ev.id, { outfit: e.target.value }); autosize(e.target); }, onblur: () => flushEvent(ev.id) });

  const details = [

    prop('tag', 'Category', catSeg),
    prop('cal', 'Date', date),
    prop('clock', 'Time', time),
    ...noteRows,
    prop('book', 'Reservation', resv),
    prop('route', 'Transportation', autoLine, el('div', { class: 'section-h' }, 'Override by hand'), el('div', { class: 'row', style: 'margin-top:6px' }, mins, mode), clearManual),
    prop('star', 'Rating', rating),

    el('div', { class: 'ed-foot' },
      el('button', { class: 'btn', onclick: () => duplicateEvent(ev.id) }, icon('copy'), 'Duplicate'),

  ];
  const tab = S.edTab || 'details';
  const counts = { details: 0, images: cardImages(ev).length, links: (ev.links || []).filter(Boolean).length };
  const tabs = el('div', { class: 'ed-tabs', role: 'tablist' },
    [['details', 'Details'], ['images', 'Images'], ['links', 'Links']].map(([id, label]) =>
      el('button', { role: 'tab', 'aria-selected': String(tab === id), onclick: () => { S.edTab = id; S.imgNote = ''; renderEditor(); } },
        label, counts[id] ? el('span', { class: 'n' }, counts[id]) : null)));
  ed.append(
    el('div', { class: 'ed-top' },
      el('span', { class: 'day', style: 'padding-left:8px' }, (S.draftId === ev.id ? 'New card · ' : '') + dayName),
      el('button', { class: 'iconbtn', 'aria-label': 'Close', onclick: closeEditor }, icon('x'))),

      el('div', { class: 'ed-hero' }, emojiBtn, title),
      tabs,

/* ================= popovers ================= */
let openPop = null;
function closePop() { if (openPop) { openPop.remove(); openPop = null; document.removeEventListener('pointerdown', popOutside, true); } }
function popOutside(e) { if (openPop && !openPop.contains(e.target)) closePop(); }
function placePop(pop, anchor) {
  document.body.append(pop); openPop = pop;
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  let left = Math.min(r.left, window.innerWidth - w - 12), top = r.bottom + 6;
  if (top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 6);
  pop.style.left = Math.max(12, left) + 'px'; pop.style.top = top + 'px';
  setTimeout(() => document.addEventListener('pointerdown', popOutside, true), 0);
}
function menu(anchor, items) {
  closePop();
  const pop = el('div', { class: 'pop', role: 'menu' });
  for (const it of items) {
    if (it === 'hr') { pop.append(el('hr')); continue; }
    if (it.label && !it.onclick) { pop.append(el('div', { class: 'lbl' }, it.label)); continue; }
    pop.append(el('button', { class: it.danger ? 'danger' : '', role: 'menuitem', onclick: () => { closePop(); it.onclick(); } }, el('span', { class: 'chk' }, it.checked ? '✓' : ''), it.label));
  }
  placePop(pop, anchor);
}

function tutorialDialog() {

  const wrap = el('div', { class: 'tut' });

        pg.kicker ? el('div', { class: 'label rule' }, pg.kicker) : el('span', { hidden: true }),
        el('h2', { class: 'tut-title' + (i ? '' : ' big') }, pg.title),

        el('div', { class: 'dots', 'aria-label': `Page ${i + 1} of ${TUT_PAGES.length}` }, TUT_PAGES.map((_, k) => el('span', { class: 'dot' + (k === i ? ' on' : '') }))),
        last ? el('button', { class: 'btn primary', onclick: () => { remember(); d.close(); } }, "Let's plan")

    el('div', { class: 'field' }, el('label', {}, 'Travelers'), trav, el('span', { class: 'hint' }, 'Each traveler gets their own notes on every card.')),

    el('div', { class: 'dlg-actions' },

    el('div', { class: 'field' }, el('label', {}, 'Travelers'), trav, el('span', { class: 'hint' }, 'Comma-separated. Each traveler gets a notes field on every card.')),
    el('div', { class: 'field' }, el('label', {}, 'Stays'), el('span', { class: 'hint' }, 'Where you are on which dates. Days on the board follow from these, and place searches look in that day\'s city. A day that ends one stay and starts the next is a travel day.'), stays, el('div', {}, addStay)),
    el('div', { class: 'field' }, el('label', {}, 'Cities'), cities, el('span', { class: 'hint' }, 'Filled in from the stays. Add extra cities here if you like.')),
    el('div', { class: 'field' }, el('label', {}, 'Hotels'), el('span', { class: 'hint' }, 'Where each day starts, from the first morning to the last. Hotels never appear on the board; they only give the first stop of the day its travel row. If two overlap, the later one wins.'), hotels, el('div', {}, addHotel)),
    el('div', { class: 'field' }, el('label', {}, 'Categories'), el('span', { class: 'hint' }, 'Top to bottom is also the order for cards that have no time.'), list, el('div', {}, addCat)),
    el('div', { class: 'field' }, el('label', {}, 'Sharing'), sharingBox),
    el('div', { class: 'field' }, el('label', {}, 'Google Maps'), mapsStatus,
      el('span', { class: 'hint' }, 'Directions between two located cards are searched automatically whenever a card is added, moved, or given a place. The Google key and the short-link helper are built into the board.')),
    el('div', { class: 'dlg-actions' },
      el('button', { class: 'btn danger', style: 'margin-right:auto', onclick: () => {
        if (confirm(`Delete the trip “${t.name}” and all of its cards? This cannot be undone.`)) {
          d.close(); const id = t.id; delete S.trips[id]; delete S.pendingTrip[id];
          const next = Object.values(S.trips).sort((a, b) => a.createdAt - b.createdAt)[0];
          selectTrip(next ? next.id : null);
          track(Promise.resolve(S.store.deleteTrip(id))); renderAll();
        } } }, icon('trash'), 'Delete trip'),
      el('button', { class: 'btn primary', onclick: () => { clearTimeout(S.timers['trip:' + t.id]); saveTrip(t); d.close(); } }, 'Done')),
  ]);
}

/* ================= sample trip (first run on this device) ================= */
function sampleTrip() {
  const t = newTrip({ name: 'Tokyo & Bangkok', start: '2026-12-02', nDays: 0, travelers: ['Ryan', 'Katie'], cities: [] });
  t.stays = [{ city: 'Tokyo', from: '2026-12-02', to: '2026-12-08' }, { city: 'Bangkok', from: '2026-12-08', to: '2026-12-13' }];
  t.hotels = clone(DEFAULT_HOTELS); t.hotelsSeeded = true;
  applyStays(t);
  return { trip: t, events: [] };
}
window.__sampleTrip = sampleTrip;
window.__confetti = confetti;
window.__parseMapsLink = parseMapsLink;

/* A browser can sit on a cached copy of this page for a long time, which looks exactly like
   changes not syncing. Check now and then whether a newer board has been published. */
async function checkForUpdate() {
  if (S.updateReady || !/^https?:/.test(location.protocol)) return;
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'reload' });
    if (!r.ok) return;
    const m = (await r.text()).match(/const BUILD = '([^']+)'/);
    if (m && m[1] !== BUILD) { S.updateReady = m[1]; setStatus(); }
  } catch (e) { /* offline: nothing to do */ }
}

/* ================= boot ================= */
const HERO_LS = 'bookshelf-of-memories/hero-collapsed';
function collapseHero() { document.body.classList.add('hero-collapsed'); LS.set(HERO_LS, '1'); }
function expandHero() { document.body.classList.remove('hero-collapsed'); LS.set(HERO_LS, null); }
if (LS.get(HERO_LS)) document.body.classList.add('hero-collapsed');
async function boot() {
  renderTop(); renderBoard();
  $('#backdrop').addEventListener('click', closeEditor);
  let swipeTimer = 0;
  $('#board').addEventListener('scroll', () => {
    if (!isPhone() || S.syncing) return;
    clearTimeout(swipeTimer);
    swipeTimer = setTimeout(() => {
      const board = $('#board'); const pad = parseFloat(getComputedStyle(board).paddingLeft);
      let best = null, bd = Infinity;
      board.querySelectorAll('.col[data-date]').forEach(c => { if (!c.dataset.date) return; const d = Math.abs(c.offsetLeft - pad - board.scrollLeft); if (d < bd) { bd = d; best = c.dataset.date; } });
      if (best && best !== S.day) { S.day = best; renderDayNav(); }
    }, 120);
  }, { passive: true });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (openPop) closePop(); else if (S.editingId && !$('#dlg').open) closeEditor(); } });
  window.addEventListener('beforeunload', () => { for (const id in S.pending) flushEvent(id); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) for (const id in S.pending) flushEvent(id); });
  loadMaps();
  checkForUpdate();
  setInterval(checkForUpdate, 300000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });

  let db = null;
  try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch (e) { console.warn(e); }
  if (db) { S.store = new DbStore(db); S.backend = 'shared'; }
  else {
    const local = new LocalStore();
    let shared = null;
    if (DEFAULT_RESOLVER_URL) { try { shared = await new ScriptStore(DEFAULT_RESOLVER_URL, local).init(); } catch (e) { console.warn('shared store unavailable', e); } }
    if (shared) {
      const remoteEmpty = !Object.keys(shared.data.trips).length, localHas = Object.keys(local.data.trips).length > 0;
      let handedOver = true;
      if (remoteEmpty && localHas) { try { await shared.adopt(local.data); } catch (e) { console.warn(e); handedOver = false; } }
      if (handedOver) { S.store = shared; S.backend = 'shared'; }
      // The shared board is there but would not take this device's trip. Keep showing the real
      // board from this device rather than an empty shared one, and try again in the background.
      else { S.store = local; S.backend = 'local'; S.offline = true; retryShared(local); }
    } else {
      S.store = local; S.backend = 'local'; S.lastError = ''; S.offline = true;
      retryShared(local); // keep trying, so this visitor joins the shared board as soon as it answers
    }
  }

  let first = true;
  const onTrips = list => {
    const next = {};
    for (const t of list) next[t.id] = S.pendingTrip[t.id] || normalizeTrip(t);
    for (const id in S.pendingTrip) if (!next[id]) next[id] = S.pendingTrip[id];
    S.trips = next;
    if (first) {
      first = false; S.ready = true;
      if (!list.length) {
        const { trip: t, events } = sampleTrip();
        S.trips[t.id] = t; track(S.store.saveTrip(t)); for (const e of events) track(S.store.saveEvent(t.id, e));
      }
      seedLondonTrip();
      const last = LS.get('bookshelf-of-memories/last-trip');
      const pick = S.trips[last] ? last : (Object.values(S.trips).sort((a, b) => a.createdAt - b.createdAt)[0] || {}).id || null;
      selectTrip(pick);
      if (!LS.get(TUTORIAL_LS)) setTimeout(tutorialDialog, 600);
    } else if (S.tripId && !S.trips[S.tripId]) {
      const nxt = Object.values(S.trips).sort((a, b) => a.createdAt - b.createdAt)[0];
      selectTrip(nxt ? nxt.id : null);
    }
    for (const id in S.events) normalizeEvent(S.events[id], trip());
    renderAll();
  };
  const onTripsError = e => { S.lastError = 'Could not open the shared trip'; S.ready = true; renderAll(); };
  S.onTrips = onTrips; S.onTripsError = onTripsError;
  S.unsubTrips = S.store.watchTrips(onTrips, onTripsError);
}

/* The shared store can be slow or briefly unreachable when the page loads. Keep asking:
   the moment it answers, this device's work goes up and the board follows everyone else. */
function retryShared(local) {
  if (!DEFAULT_RESOLVER_URL || S.sharedRetry) return;
  S.sharedRetry = setInterval(async () => {
    if (S.backend === 'shared') { clearInterval(S.sharedRetry); S.sharedRetry = 0; return; }
    let shared = null;
    try { shared = await new ScriptStore(DEFAULT_RESOLVER_URL, local).init(); } catch (e) { return; }
    clearInterval(S.sharedRetry); S.sharedRetry = 0;
    try { await shared.merge(local.data); } catch (e) { console.warn(e); }
    S.unsubTrips && S.unsubTrips(); S.unsubEvents && S.unsubEvents(); S.unsubEvents = null;
    S.store = shared; S.backend = 'shared'; S.offline = false; S.lastError = null;
    S.unsubTrips = S.store.watchTrips(S.onTrips, S.onTripsError);
    if (S.tripId) selectTrip(S.tripId);
    setStatus(); renderAll();
  }, 30000);
}
boot();
})();
</script>
