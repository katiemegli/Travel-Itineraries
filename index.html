<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bookshelf of Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,600&family=Courier+Prime:wght@400;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
/* ---------- design tokens: paper, ink, terracotta, mustard ---------- */
:root{
  --paper:#F4F1EA; --paper-2:#E8E6DF; --white:#FFFFFF; --ink:#1F1F1F; --muted:rgba(31,31,31,.6); --faint:rgba(31,31,31,.4);
  --line:#D1D1C9; --line-soft:rgba(0,0,0,.08); --line-strong:#1F1F1F;
  --terracotta:#C65D3B; --mustard:#FFC233; --accent:var(--terracotta); --accent-soft:rgba(198,93,59,.12); --accent-ink:#F4F1EA; --danger:#A8422A; --ok:#1F1F1F; --icon-idle:#D1D1C9;
  --bg:var(--paper); --panel:var(--white); --panel-2:rgba(31,31,31,.06);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --type:'Courier Prime','Courier New',Courier,monospace;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --sp-xs:4px; --sp-sm:8px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px; --sp-xxl:56px;
  --shadow:20px 20px 60px rgba(0,0,0,.05); --shadow-lg:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
  --grain:url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='200' height='200' fill='white'/%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='0.15'/%3E%3C/svg%3E");
  color-scheme:light;
}

/* ---------- base ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background-color:var(--paper);color:var(--ink);font:400 17px/1.45 var(--serif);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  background-image:url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E")}
::selection{background:var(--terracotta);color:#fff}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
input,select,textarea{background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%;min-width:0;font:400 14px/1.4 var(--sans)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);background:#fff}
textarea{resize:none}
input[type="checkbox"]{width:auto}
input::placeholder,textarea::placeholder{color:var(--faint)}
.hidden,[hidden]{display:none!important}
a{color:inherit}
::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:#D1D1C9;border-radius:3px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.type{font-family:var(--type)}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.03;z-index:100;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E")}

#app{min-height:100dvh;display:flex;flex-direction:column}

/* ---------- top area ---------- */
.top{display:flex;flex-direction:column;padding:var(--sp-xl) var(--sp-xl) 0;padding-top:max(var(--sp-xl),env(safe-area-inset-top))}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-md)}
.trip-btn{display:flex;align-items:center;gap:12px;font:400 11px/1 var(--type);text-transform:uppercase;letter-spacing:.2em;color:var(--ink)}
.trip-btn .ring{width:40px;height:40px;border:1px solid currentColor;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:background .2s,color .2s;flex:none}
.trip-btn:hover .ring{background:var(--ink);color:var(--paper)}
.trip-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5}
.top-actions{display:flex;align-items:center;gap:4px;flex:none}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font:400 10px/1 var(--type);text-transform:uppercase;letter-spacing:.2em;padding:6px 8px;white-space:nowrap}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.status.ok .dot{background:var(--ink)}
.status.busy .dot{background:var(--terracotta);animation:pulse 1s infinite}
.status.err{color:var(--terracotta)} .status.err .dot{background:var(--terracotta)}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);transition:background .2s,color .2s}
.iconbtn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.trip-header{margin-top:var(--sp-xl);margin-bottom:var(--sp-md)}
.trip-name{font:300 64px/.9 var(--serif);letter-spacing:-.01em;display:block;text-wrap:balance}
.trip-name em{font-style:italic;display:inline-block;margin-left:.5em}
.trip-sub{font:400 13px/1.7 var(--type);color:var(--ink);opacity:.8;margin-top:var(--sp-md);max-width:520px}
.filters{display:flex;gap:var(--sp-lg);padding:var(--sp-md) var(--sp-xl) var(--sp-md);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:0;padding:4px 0;font:400 10px/1 var(--type);text-transform:uppercase;letter-spacing:.2em;color:var(--ink);opacity:.5;background:none;display:inline-flex;gap:8px;align-items:center;white-space:nowrap;transition:color .2s,opacity .2s}
.fchip:hover{color:var(--terracotta);opacity:1}
.fchip[aria-pressed="true"]{opacity:1}
.fchip[aria-pressed="true"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--terracotta)}
.fchip .n{opacity:.6}

/* ---------- board ---------- */
.main{flex:1;display:flex;align-items:flex-start;position:relative;background:var(--paper-2);border-top:1px solid rgba(209,209,201,.5)}
.board{flex:1;min-width:0;overflow-x:auto;display:flex;gap:var(--sp-md);padding:var(--sp-lg) var(--sp-xl) var(--sp-xxl);align-items:flex-start;scroll-snap-type:x proximity;scroll-padding-left:var(--sp-xl);-webkit-overflow-scrolling:touch}
.col{flex:0 0 380px;width:380px;display:flex;flex-direction:column;scroll-snap-align:start;background:var(--white);border:1px solid rgba(0,0,0,.05);box-shadow:var(--shadow);position:relative;overflow:hidden;transition:background .15s}
.col::before{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.4;pointer-events:none;mix-blend-mode:multiply}
.col::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:4px;background-image:radial-gradient(circle,var(--paper-2) 2px,transparent 3px);background-size:12px 100%;background-position:center;z-index:2}
.col.drop{background:#FFF6D6}
.col-head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-sm);padding:var(--sp-xl) var(--sp-xl) var(--sp-md);border-bottom:1px solid rgba(0,0,0,.1);margin:0 var(--sp-xl);padding-left:0;padding-right:0;position:relative;z-index:1}
.col-head .dow{font:400 30px/1 var(--serif)}
.col-head .date{font:400 10px/1.6 var(--type);text-transform:uppercase;letter-spacing:.2em;opacity:.6}
.col-head .right{display:flex;align-items:center;gap:var(--sp-sm)}
.col-head .cnt{display:none}
.col-head .menu{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--faint)}
.col-head .menu:hover{color:var(--ink);background:var(--panel-2)}
.col-head .menu svg{width:16px;height:16px}
.col-body{flex:none;padding:var(--sp-lg) var(--sp-xl) var(--sp-xl);display:flex;flex-direction:column;position:relative;z-index:1}
.col.unsched{background:transparent;border:1px dashed var(--line);box-shadow:none}
.col.unsched::before,.col.unsched::after{display:none}
.col.unsched .col-head .dow{color:var(--muted);font-style:italic}
.col.addday{flex-basis:220px;width:220px;background:transparent;border:0;box-shadow:none}
.col.addday::before,.col.addday::after{display:none}
.col.addday .col-head{border-bottom-color:transparent}
.addday-btn,.newcard{display:inline-flex;align-items:center;gap:10px;color:var(--ink);padding:10px 18px;border-radius:999px;border:1px solid var(--ink);font:400 10px/1 var(--type);text-transform:uppercase;letter-spacing:.2em;width:fit-content;background:transparent;transition:background .2s,color .2s}
.addday-btn:hover,.newcard:hover{background:var(--ink);color:var(--paper)}
.newcard{margin-top:var(--sp-lg);margin-left:64px}
.addday-btn svg,.newcard svg{width:12px;height:12px}
.empty-col{color:var(--muted);font-style:italic;font-size:16px;line-height:1.4;padding:0 0 var(--sp-md) 64px}

/* menu-style event rows: time column + details */
.card{display:flex;gap:var(--sp-md);position:relative;padding:0;cursor:pointer;user-select:none;-webkit-user-select:none}
.card:hover .title{font-style:italic}
.card.dragging{opacity:.35}
.card.ghost{position:fixed;z-index:100;pointer-events:none;background:var(--white);box-shadow:var(--shadow-lg);padding:var(--sp-md);opacity:.98;cursor:grabbing;transform-origin:center}
.card.archived{opacity:.45}
.card.archived .title{text-decoration:line-through}
.time-col{width:48px;flex:none;text-align:left;padding-top:22px}
.time{font:400 13px/1 var(--type)}
.details{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.card-cat{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font:400 10px/1 var(--type);text-transform:uppercase;letter-spacing:.3em;color:var(--terracotta);margin-bottom:2px;padding:0;background:none}
.card-cat::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--terracotta)}
.card-cat i{display:none}
.card-head{display:flex;align-items:baseline;gap:8px}
.card-emoji{font-size:17px;line-height:1;flex:none;font-family:system-ui}
.card-emoji.none{display:none}
.title{font:400 22px/1.2 var(--serif);flex:1;min-width:0;overflow-wrap:anywhere;transition:font-style .15s}
.title.untitled{color:var(--muted);font-style:italic}
.grip{position:absolute;right:0;top:0;width:28px;height:28px;border-radius:50%;color:var(--icon-idle);display:inline-flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.grip:hover{color:var(--ink)}
.grip svg{width:14px;height:14px}
.card-res{font:italic 400 15px/1.35 var(--serif);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.card-res .st{font:400 10px/1.6 var(--type);text-transform:uppercase;letter-spacing:.2em;font-style:normal}
.card-res.booked .st{color:var(--ink);opacity:.6}
.card-res.open .st{color:var(--ink);background:var(--mustard);padding:2px 8px;border-radius:2px}
.card-res .det{color:var(--muted);overflow-wrap:anywhere}
.card-meta{display:flex;flex-wrap:wrap;gap:var(--sp-sm);align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font:400 11px/1 var(--type);padding:0;white-space:nowrap;background:none;color:var(--ink)}
.chip.tone{background:none;color:var(--ink)}
.chip.est::after{content:"est.";font-size:9px;opacity:.6;margin-left:2px}
.stars{font-size:13px;letter-spacing:2px;color:var(--terracotta)}
.note{display:flex;gap:8px;font:italic 400 15px/1.35 var(--serif);color:var(--muted);align-items:baseline}
.note .who{flex:none;font:400 10px/1.6 var(--type);text-transform:uppercase;letter-spacing:.15em;color:var(--ink);font-style:normal;opacity:.7}
.note .who::after{content:"·";margin-left:6px}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.card-foot{display:flex;flex-wrap:wrap;gap:var(--sp-md);font:400 10px/1.6 var(--type);text-transform:uppercase;letter-spacing:.15em;color:var(--muted);align-items:center}
.card-foot .chip{background:none;padding:0;font:inherit;color:inherit}
.card-foot .outfit{display:inline-flex;gap:4px;align-items:center;overflow-wrap:anywhere;text-transform:none;letter-spacing:0;font:italic 400 15px/1.35 var(--serif)}
.action-link{display:inline-flex;align-items:center;gap:10px;font:400 10px/1 var(--type);text-transform:uppercase;letter-spacing:.2em;color:var(--ink);text-decoration:none;margin-top:var(--sp-sm);padding:10px 18px;border:1px solid var(--ink);border-radius:999px;width:fit-content;background:transparent;transition:background .2s,color .2s}
.action-link svg{width:12px;height:12px;stroke-width:1.5}
.action-link:hover{background:var(--ink);color:var(--paper)}

/* travel-time row between two events */
.link{display:flex;gap:var(--sp-md);min-height:var(--sp-xl);align-items:center}
.link .line{width:48px;flex:none;height:100%;min-height:var(--sp-xl);position:relative}
.link .line::before{content:"";position:absolute;left:5px;top:0;bottom:0;border-left:1px dashed rgba(0,0,0,.2)}
.link .chip{background:none;padding:0;font:400 10px/1.6 var(--type);text-transform:uppercase;letter-spacing:.2em;color:var(--muted);gap:8px}
.link .chip[role="button"],.link a.chip{cursor:pointer;text-decoration:none}
.link .chip[role="button"]:hover,.link a.chip:hover{color:var(--terracotta)}
.link .addtr{color:var(--faint);font:italic 400 14px/1.4 var(--serif);opacity:1;padding:0;text-align:left}
.link .addtr:hover{color:var(--terracotta)}
.gap{height:0}

/* ---------- editor ---------- */
/* the card editor is a popover over the board */
.editor{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,calc(100vw - 24px));max-height:calc(100dvh - 40px);z-index:40;background:var(--paper);border:1px solid rgba(0,0,0,.05);box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden}
.editor::before{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.4;pointer-events:none;mix-blend-mode:multiply;z-index:0}
.editor>*{position:relative;z-index:1}
.editor.open{display:flex}
.backdrop.open{display:block}
.ed-top{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-md) var(--sp-md) 0 var(--sp-xl);flex:none}
.ed-top .day{font:400 10px/1 var(--type);text-transform:uppercase;letter-spacing:.2em;opacity:.6}
.ed-scroll{flex:1;min-height:0;overflow-y:auto;padding:var(--sp-sm) var(--sp-xl) var(--sp-xl);scrollbar-width:none}
.ed-scroll::-webkit-scrollbar{display:none}
.ed-hero{display:flex;gap:var(--sp-md);align-items:flex-start;margin:var(--sp-sm) 0 var(--sp-lg)}
.emoji-btn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);font-size:26px;line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:none;background:transparent;font-family:system-ui}
.emoji-btn.has{border-color:transparent;background:rgba(255,255,255,.7)}
.ed-title{font:300 38px/1 var(--serif);background:none;border:0;padding:6px 0;border-radius:0}
.ed-title:focus{border-color:transparent;background:none}
.emoji-pop{position:fixed;z-index:50;background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow-lg);padding:12px;width:296px}
.emoji-pop input{margin-bottom:8px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emoji-grid button{font-size:20px;height:32px;border-radius:4px;font-family:system-ui}
.emoji-grid button:hover{background:var(--panel-2)}
.prop{display:grid;grid-template-columns:132px 1fr;gap:var(--sp-md);align-items:start;padding:var(--sp-sm) 0;min-height:44px}
.prop-k{display:flex;align-items:center;gap:8px;color:var(--ink);opacity:.5;font:400 10px/1 var(--type);text-transform:uppercase;letter-spacing:.2em;padding-top:13px;white-space:nowrap;min-width:0}
.prop-k span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.prop-k svg{width:14px;height:14px;flex:none;stroke-width:1.5}
.prop-v{min-width:0}
.prop-v .row{display:flex;gap:8px;align-items:center}
.prop-v .row input[type="number"]{width:88px;flex:none}
.switch{display:inline-flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer}
.switch input{appearance:none;width:36px;height:22px;border-radius:999px;background:var(--line);position:relative;margin:0;padding:0;border:0;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--terracotta)}
.switch input:checked::after{left:16px}
.switch span{font:italic 400 15px/1.4 var(--serif);color:var(--muted)}
.rating{display:flex;gap:2px;padding:8px 0}
.rating button{font-size:22px;line-height:1;color:var(--line);padding:2px}
.rating button.on{color:var(--terracotta)}
.rating .clear{font:400 10px/1 var(--type);text-transform:uppercase;letter-spacing:.2em;color:var(--muted);margin-left:8px;align-self:center}
.ed-foot{display:flex;gap:8px;padding:var(--sp-lg) 0 0;border-top:1px dashed rgba(0,0,0,.2);margin-top:var(--sp-lg)}
.btn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:10px 18px;font:400 10px/1 var(--type);text-transform:uppercase;letter-spacing:.2em;display:inline-flex;align-items:center;gap:10px;color:var(--ink);transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--terracotta);color:var(--paper);border-color:var(--terracotta)}
.btn.primary:hover{background:var(--ink);border-color:var(--ink)}
.btn.primary:disabled{opacity:.4;cursor:default;background:var(--terracotta);border-color:var(--terracotta)}
.btn.danger{color:var(--terracotta);border-color:var(--line)}
.btn.danger:hover{background:var(--terracotta);color:var(--paper);border-color:var(--terracotta)}
.btn svg{width:12px;height:12px}
.ed-hint{color:var(--muted);font:italic 400 14px/1.4 var(--serif);margin-top:6px}
.backdrop{display:none;position:fixed;inset:0;background:rgba(31,31,31,.35);z-index:30}

/* ---------- segmented controls & forms ---------- */
.seg{display:flex;flex-wrap:wrap;gap:var(--sp-sm)}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font:400 10px/1 var(--type);text-transform:uppercase;letter-spacing:.15em;color:var(--ink);display:inline-flex;gap:6px;align-items:center;transition:background .2s,color .2s,border-color .2s}
.seg button:hover{border-color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--terracotta);color:var(--paper);border-color:var(--terracotta)}
.suggest-wrap{position:relative}
.suggest{position:absolute;left:0;right:0;top:calc(100% - 18px);background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow-lg);z-index:60;max-height:264px;overflow-y:auto;padding:4px}
.suggest button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:2px;font:400 18px/1.2 var(--serif)}
.suggest button .sec{display:block;font:400 11px/1.5 var(--type);color:var(--muted)}
.suggest button[aria-selected="true"],.suggest button:hover{background:rgba(31,31,31,.06)}
.suggest button[aria-selected="true"] .main,.suggest button:hover .main{font-style:italic}
.place-line{display:flex;gap:6px;align-items:flex-start;font:italic 400 14px/1.4 var(--serif);color:var(--muted);margin-top:6px;min-height:16px}
.place-line .addr{flex:1;min-width:0;overflow-wrap:anywhere}
.place-line .clr{color:var(--muted);padding:0 4px;font-style:normal}
.place-line .clr:hover{color:var(--terracotta)}
.place-line.busy{color:var(--terracotta)}
.place-line.warn{color:var(--terracotta)}
.auto-line{font:400 11px/1.6 var(--type);display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0 2px}
.auto-line .chip{background:none;padding:0;font:400 11px/1.6 var(--type);text-transform:uppercase;letter-spacing:.15em;color:var(--ink)}
.auto-line .why{color:var(--muted);font:italic 400 14px/1.4 var(--serif)}
.section-h{font:400 10px/1 var(--type);text-transform:uppercase;letter-spacing:.2em;color:var(--muted);margin-top:14px}
.dlg .prop{grid-template-columns:118px 1fr}

/* ---------- popover / dialogs ---------- */
.pop{position:fixed;z-index:50;background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow-lg);padding:6px;min-width:240px;max-width:min(320px,calc(100vw - 24px))}
.pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 10px;border-radius:2px;font:400 17px/1.2 var(--serif)}
.pop button:hover{background:rgba(31,31,31,.06);font-style:italic}
.pop button.danger{color:var(--terracotta)}
.pop button .chk{width:16px;flex:none;color:var(--terracotta);text-align:center}
.pop hr{border:0;border-top:1px dashed rgba(0,0,0,.2);margin:6px 4px}
.pop .lbl{font:400 10px/1 var(--type);text-transform:uppercase;letter-spacing:.2em;color:var(--muted);padding:10px 10px 4px}
dialog{background:var(--paper);color:var(--ink);border:1px solid rgba(0,0,0,.05);border-radius:4px;padding:0;width:min(560px,calc(100vw - 24px));box-shadow:var(--shadow-lg);max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(31,31,31,.4)}
.dlg{padding:var(--sp-xl);display:flex;flex-direction:column;gap:var(--sp-md);max-height:calc(100dvh - 40px);overflow-y:auto}
.dlg h2{font:300 40px/1 var(--serif);margin:0}
.dlg h2 em{font-style:italic}
.dlg p{margin:0;color:var(--muted);font:italic 400 16px/1.4 var(--serif)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:400 10px/1 var(--type);text-transform:uppercase;letter-spacing:.2em;color:var(--muted)}
.field .hint{font:italic 400 14px/1.4 var(--serif);color:var(--muted)}
.fields-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.catrow{display:grid;grid-template-columns:52px 1fr 36px;gap:6px;align-items:center}
.catrow input.em{text-align:center;font-size:18px;padding:5px;font-family:system-ui}
.catrow .del,.stayrow .del{color:var(--icon-idle);width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.catrow .del:hover,.stayrow .del:hover{background:var(--panel-2);color:var(--terracotta)}
.catlist{display:flex;flex-direction:column;gap:6px}
.stayrow{display:grid;grid-template-columns:1fr 1fr 1fr 36px;gap:6px;align-items:center}
@media (max-width:760px){.stayrow{grid-template-columns:1fr 36px}.stayrow input[type="date"]{grid-column:1}}

/* ---------- bottom nav (phones) ---------- */
.bottom-nav{display:none;justify-content:space-around;align-items:center;padding:12px var(--sp-md);padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid rgba(209,209,201,.5);position:sticky;bottom:0;z-index:20}
.nav-item{display:flex;justify-content:center;align-items:center;width:48px;height:40px;border-radius:50%;color:var(--ink);transition:all .2s}
.nav-item svg{width:20px;height:20px;fill:var(--line)}
.nav-item.active svg{fill:var(--terracotta)}

/* empty / loading */
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--sp-lg)}
.hello{max-width:460px;display:flex;flex-direction:column;gap:var(--sp-md);align-items:flex-start;background:var(--white);padding:var(--sp-xxl);border:1px solid rgba(0,0,0,.05);box-shadow:var(--shadow);transform:rotate(1deg);animation:float 6s ease-in-out infinite;position:relative;overflow:hidden}
.hello::before{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.4;pointer-events:none;mix-blend-mode:multiply}
.hello>*{position:relative}
.hello h1{font:300 56px/.9 var(--serif);margin:0;text-wrap:balance}
.hello p{color:var(--muted);margin:0;font:italic 400 18px/1.4 var(--serif)}
@keyframes float{0%{transform:translateY(0) rotate(1deg)}50%{transform:translateY(-10px) rotate(1.5deg)}100%{transform:translateY(0) rotate(1deg)}}

/* ---------- phones ---------- */
@media (max-width:760px){
  .top{padding:var(--sp-lg) var(--sp-lg) 0;padding-top:max(var(--sp-lg),env(safe-area-inset-top))}
  .top-actions .iconbtn{display:none}
  .status .txt{display:none}
  .trip-header{margin-top:var(--sp-lg);margin-bottom:var(--sp-sm)}

  .col{flex-basis:calc(100vw - 48px);width:calc(100vw - 48px)}
  .col.addday{flex-basis:180px;width:180px}
  .col-head{padding:var(--sp-lg) 0 var(--sp-sm);margin:0 var(--sp-lg)}
  .col-body{padding:var(--sp-md) var(--sp-lg) var(--sp-lg)}
  .bottom-nav{display:flex}
  .editor{width:calc(100vw - 16px);max-height:calc(100dvh - 24px)}
  .ed-scroll{padding:var(--sp-xs) var(--sp-lg) calc(var(--sp-lg) + env(safe-area-inset-bottom))}
  .prop,.dlg .prop{grid-template-columns:1fr;gap:4px}
  .prop-k{padding-top:0}
  .dlg{padding:var(--sp-lg)}
  .dlg h2{font-size:34px}
}
@media (max-width:400px){.trip-name{font-size:44px}}

</div>

<div class="grain" aria-hidden="true"></div>

    return `${a.toLocaleDateString(undefined, { month: 'short' })} ${a.getDate()} – ${b.getDate()}, ${b.getFullYear()}`;

const icon = name => { const s = el('span'); s.innerHTML = ICONS[name]; return s.firstChild; };

/* ================= constants ================= */
const MODES = {
  walk:   { label: 'walk',    icon: '🚶', h: 145 },
  subway: { label: 'subway',  icon: '🚇', h: 215 },
  bus:    { label: 'bus',     icon: '🚌', h: 215 },
  tram:   { label: 'tram',    icon: '🚋', h: 215 },
  train:  { label: 'train',   icon: '🚆', h: 245 },
  drive:  { label: 'car',     icon: '🚗', h: 38 },
  taxi:   { label: 'taxi',    icon: '🚕', h: 38 },
  tuktuk: { label: 'tuk-tuk', icon: '🛺', h: 38 },
  bike:   { label: 'bike',    icon: '🚲', h: 100 },
  ferry:  { label: 'ferry',   icon: '⛴️', h: 190 },
  flight: { label: 'flight',  icon: '✈️', h: 275 },
};
const TIME_H = 325;
const WALK_MAX = 35, TRANSIT_MAX = 45; // minutes: walk under 35, subway under 45, otherwise car
// List order doubles as the sort order for cards without a time.
const DEFAULT_CATEGORIES = [
  { id: 'lunch',    name: 'Lunch',        emoji: '🥪', h: 40,  autoTime: '12:00', sortTime: '12:00' },
  { id: 'cafe',     name: 'Dessert/Cafe', emoji: '🍰', h: 330, sortTime: '14:30' },
  { id: 'activity', name: 'Activity',     emoji: '🎟️', h: 210, sortTime: '15:00' },
  { id: 'dinner',   name: 'Dinner',       emoji: '🍽️', h: 18,  autoTime: '17:30', sortTime: '17:30' },
  { id: 'bar',      name: 'Bar',          emoji: '🍸', h: 275, sortTime: '20:30' },
];
const LEGACY_CAT = { food: ev => (!ev.time || ev.time < '15:00') ? 'lunch' : 'dinner', drinks: 'bar', sights: 'activity', hotel: 'activity', transit: 'activity', rest: 'activity', shopping: 'activity' };
const EMOJI = '🥪 🍜 🍣 🍛 🍕 🍔 🥐 🍰 🍦 ☕ 🍵 🍷 🍸 🍺 🥂 🍹 🏛️ 🏰 🗼 🗽 ⛩️ 🕌 🎡 🎢 🎨 🖼️ 🎭 🎶 🎫 🎟️ 🌺 🌸 🌳 🌊 🏖️ ⛰️ 🏞️ 🌅 🌃 🏙️ 🛍️ 👗 👚 💄 💅 🧖 🛀 🛏️ 🏨 🏠 🛬 🛫 ✈️ 🚆 🚇 🚌 🚕 ⛴️ 🚲 🐚 🐔 🍗 🥩 🦞 🦪 🐟 🧭 📸 🗺️ 🎁 💍 ❤️ ⭐'.split(' ');

/* ================= storage backends ================= */
class LocalStore {
  constructor() {
    this.key = 'bookshelf-of-memories/v1';
    this.data = this.read();
    this.tripCb = null; this.evCb = null; this.evTrip = null;
    window.addEventListener('storage', e => {
      if (e.key !== this.key) return;
      this.data = this.read();
      this.tripCb && this.tripCb(Object.values(this.data.trips));
      this.evCb && this.evCb(Object.values(this.data.events[this.evTrip] || {}));
    });
  }
  read() { try { return JSON.parse(localStorage.getItem(this.key)) || { trips: {}, events: {} }; } catch { return { trips: {}, events: {} }; } }
  persist() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { throw { code: 'unavailable', message: 'Could not save to this browser' }; } }
  watchTrips(cb) { this.tripCb = cb; cb(Object.values(this.data.trips)); return () => { this.tripCb = null; }; }
  watchEvents(tripId, cb) { this.evCb = cb; this.evTrip = tripId; cb(Object.values(this.data.events[tripId] || {})); return () => { this.evCb = null; }; }
  async saveTrip(t) { this.data.trips[t.id] = t; this.persist(); }
  async deleteTrip(id) { delete this.data.trips[id]; delete this.data.events[id]; this.persist(); }
  async saveEvent(tripId, ev) { (this.data.events[tripId] ||= {})[ev.id] = ev; this.persist(); }
  async deleteEvent(tripId, id) { delete (this.data.events[tripId] || {})[id]; this.persist(); }
}
class DbStore {
  constructor(db) { this.db = db; }
  async retry(fn) {
    try { return await fn(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return fn(); }
      throw e;
    }
  }
  watchTrips(cb, err) { return this.db.collection('trips').onSnapshot(s => cb(s.docs.filter(d => d.exists).map(d => d.data())), err); }
  watchEvents(tripId, cb, err) { return this.db.collection('trips/' + tripId + '/events').onSnapshot(s => cb(s.docs.filter(d => d.exists).map(d => d.data())), err); }
  saveTrip(t) { return this.retry(() => this.db.doc('trips/' + t.id).set(clone(t))); }
  async deleteTrip(id) {
    const evs = await this.db.collection('trips/' + id + '/events').get();
    for (const d of evs.docs) await this.db.doc('trips/' + id + '/events/' + d.id).delete();
    await this.retry(() => this.db.doc('trips/' + id).delete());
  }
  saveEvent(tripId, ev) { return this.retry(() => this.db.doc('trips/' + tripId + '/events/' + ev.id).set(clone(ev))); }
  deleteEvent(tripId, id) { return this.retry(() => this.db.doc('trips/' + tripId + '/events/' + id).delete()); }
}

};
const trip = () => S.trips[S.tripId];
const catOf = id => (trip()?.categories || []).find(c => c.id === id);
const catIndex = id => { const i = (trip()?.categories || []).findIndex(c => c.id === id); return i < 0 ? 99 : i; };

/* ================= normalization (older saved shapes) ================= */
function normalizeTrip(t) {
  if (!Array.isArray(t.categories) || !t.categories.length) t.categories = clone(DEFAULT_CATEGORIES);
  const ids = new Set(t.categories.map(c => c.id));
  if (!['lunch', 'dinner', 'bar', 'cafe', 'activity'].some(id => ids.has(id)) && [...ids].some(id => LEGACY_CAT[id])) t.categories = clone(DEFAULT_CATEGORIES);
  t.travelers ||= []; t.cities ||= []; t.days ||= []; t.stays ||= [];
  return t;
}

    el('div', { class: 'dlg-actions' },
      el('button', { class: 'btn', onclick: () => d.close() }, 'Cancel'),
      el('button', { class: 'btn primary', onclick: () => {
        const t = newTrip({ name: name.value.trim(), start: start.value || today(), nDays: Math.min(60, Math.max(1, parseInt(days.value, 10) || 1)),
          travelers: splitList(trav.value), cities: splitList(cities.value) });
        d.close(); saveTrip(t); selectTrip(t.id);
      } }, 'Create trip')),
  ]);
  setTimeout(() => name.focus(), 30);
}
function settingsDialog() {
  const t = trip(); if (!t) return;
  const save = () => saveTrip(t, { debounced: true });
  const name = el('input', { value: t.name, oninput: e => { t.name = e.target.value; save(); } });
  const sub = el('input', { value: t.subtitle, placeholder: 'Shown under the name (optional)', oninput: e => { t.subtitle = e.target.value; save(); } });
  const trav = el('input', { value: t.travelers.join(', '), oninput: e => { t.travelers = splitList(e.target.value); save(); } });
  // Stays: city + dates. Days on the board and the city list follow from these.
  const stays = el('div', { class: 'catlist' });
  const renderStays = () => {
    stays.replaceChildren(...t.stays.map(s => el('div', { class: 'stayrow' },
      el('input', { value: s.city, placeholder: 'City', 'aria-label': 'City', oninput: e => { s.city = e.target.value.trim(); applyStays(t); save(); } }),
      el('input', { type: 'date', value: s.from, 'aria-label': 'First day', onchange: e => { s.from = e.target.value; if (!s.to || s.to < s.from) s.to = s.from; applyStays(t); save(); renderStays(); } }),
      el('input', { type: 'date', value: s.to, 'aria-label': 'Last day', onchange: e => { s.to = e.target.value; if (s.from && s.to < s.from) s.from = s.to; applyStays(t); save(); renderStays(); } }),
      el('button', { class: 'del', 'aria-label': `Remove ${s.city || 'stay'}`, onclick: () => { t.stays = t.stays.filter(x => x !== s); save(); renderStays(); } }, icon('x')))));
  };
  renderStays();
  const addStay = el('button', { class: 'btn', onclick: () => {
    const last = t.stays[t.stays.length - 1];
    const from = last && last.to ? last.to : (t.days[t.days.length - 1] || today());
    t.stays.push({ city: '', from, to: addDays(from, 3) }); applyStays(t); save(); renderStays(); stays.lastChild.children[0].focus();
  } }, icon('plus'), 'Add a stay');
  const cities = el('input', { value: (t.cities || []).join(', '), oninput: e => { t.cities = splitList(e.target.value); save(); } });
  const list = el('div', { class: 'catlist' });
  const renderCats = () => {
    list.replaceChildren(...t.categories.map(c => el('div', { class: 'catrow' },
      el('input', { class: 'em', value: c.emoji, maxlength: 4, 'aria-label': 'Emoji', oninput: e => { c.emoji = [...e.target.value].slice(-1)[0] || ''; save(); } }),
      el('input', { value: c.name, 'aria-label': 'Category name', oninput: e => { c.name = e.target.value; save(); } }),
      el('button', { class: 'del', 'aria-label': `Remove ${c.name}`, onclick: () => { t.categories = t.categories.filter(x => x !== c); save(); renderCats(); } }, icon('x')))));
  };
  renderCats();
  const addCat = el('button', { class: 'btn', onclick: () => { t.categories.push({ id: uid(), name: 'New category', emoji: '✨', h: Math.floor(Math.random() * 360), sortTime: '' }); save(); renderCats(); list.lastChild.children[1].focus(); list.lastChild.children[1].select(); } }, icon('plus'), 'Add category');

  // Google Maps key lives on this device only, never in the shared trip.
  const mapsStatus = el('span', { class: 'hint' },
    S.maps.state === 'ready' ? 'Google Maps is connected. Names look up addresses, the place field suggests matches as you type, and travel times come from Google directions.'
    : S.maps.state === 'loading' ? 'Connecting to Google Maps…'
    : S.maps.error ? S.maps.error + ' Until then, addresses come from OpenStreetMap and travel times are routed there or estimated.'
    : (osmOk() ? 'Google Maps could not load on this page. Addresses come from OpenStreetMap and travel times are routed there.' : 'Google Maps could not load on this page. Travel times are estimated from pins.'));
  const d = dialog([
    el('h2', {}, 'Trip settings'),
    el('div', { class: 'field' }, el('label', {}, 'Trip name'), name),
    el('div', { class: 'field' }, el('label', {}, 'Subtitle'), sub),
    el('div', { class: 'field' }, el('label', {}, 'Travelers'), trav, el('span', { class: 'hint' }, 'Comma-separated. Each traveler gets a notes field on every card.')),
    el('div', { class: 'field' }, el('label', {}, 'Stays'), el('span', { class: 'hint' }, 'Where you are on which dates. Days on the board follow from these, and place searches look in that day\'s city. A day that ends one stay and starts the next is a travel day.'), stays, el('div', {}, addStay)),
    el('div', { class: 'field' }, el('label', {}, 'Cities'), cities, el('span', { class: 'hint' }, 'Filled in from the stays. Add extra cities here if you like.')),
    el('div', { class: 'field' }, el('label', {}, 'Categories'), el('span', { class: 'hint' }, 'Top to bottom is also the order for cards that have no time.'), list, el('div', {}, addCat)),
    el('div', { class: 'field' }, el('label', {}, 'Google Maps'), mapsStatus,
      el('span', { class: 'hint' }, 'Directions between two located cards are searched automatically whenever a card is added, moved, or given a place. The Google key and the short-link helper are built into the board.')),
    el('div', { class: 'dlg-actions' },
      el('button', { class: 'btn danger', style: 'margin-right:auto', onclick: () => {
        if (confirm(`Delete the trip “${t.name}” and all of its cards? This cannot be undone.`)) {
          d.close(); const id = t.id; delete S.trips[id]; delete S.pendingTrip[id];
          const next = Object.values(S.trips).sort((a, b) => a.createdAt - b.createdAt)[0];
          selectTrip(next ? next.id : null);
          track(Promise.resolve(S.store.deleteTrip(id))); renderAll();
        } } }, icon('trash'), 'Delete trip'),
      el('button', { class: 'btn primary', onclick: () => { clearTimeout(S.timers['trip:' + t.id]); saveTrip(t); d.close(); } }, 'Done')),
  ]);
}

/* ================= sample trip (first run on this device) ================= */
function sampleTrip() {
  const t = newTrip({ name: 'Bangkok & Tokyo', start: '2026-12-02', nDays: 0, travelers: ['Ryan', 'Katie'], cities: [] });
  t.stays = [{ city: 'Bangkok', from: '2026-12-02', to: '2026-12-08' }, { city: 'Tokyo', from: '2026-12-08', to: '2026-12-13' }];
  applyStays(t);
  return { trip: t, events: [] };
}
window.__sampleTrip = sampleTrip;
window.__parseMapsLink = parseMapsLink;

/* ================= boot ================= */
async function boot() {
  renderTop(); renderBoard();
  $('#backdrop').addEventListener('click', closeEditor);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (openPop) closePop(); else if (S.editingId && !$('#dlg').open) closeEditor(); } });
  window.addEventListener('beforeunload', () => { for (const id in S.pending) flushEvent(id); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) for (const id in S.pending) flushEvent(id); });
  loadMaps();

  let db = null;
  try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch (e) { console.warn(e); }
  S.store = db ? new DbStore(db) : new LocalStore();
  S.backend = db ? 'shared' : 'local';

  let first = true;
  S.store.watchTrips(list => {
    const next = {};
    for (const t of list) next[t.id] = S.pendingTrip[t.id] || normalizeTrip(t);
    for (const id in S.pendingTrip) if (!next[id]) next[id] = S.pendingTrip[id];
    S.trips = next;
    if (first) {
      first = false; S.ready = true;
      if (!list.length && S.backend === 'local') {
        const { trip: t, events } = sampleTrip();
        S.trips[t.id] = t; track(S.store.saveTrip(t)); for (const e of events) track(S.store.saveEvent(t.id, e));
      }
      const last = LS.get('bookshelf-of-memories/last-trip');
      const pick = S.trips[last] ? last : (Object.values(S.trips).sort((a, b) => a.createdAt - b.createdAt)[0] || {}).id || null;
      selectTrip(pick);
    } else if (S.tripId && !S.trips[S.tripId]) {
      const nxt = Object.values(S.trips).sort((a, b) => a.createdAt - b.createdAt)[0];
      selectTrip(nxt ? nxt.id : null);
    }
    for (const id in S.events) normalizeEvent(S.events[id], trip());
    renderAll();
  }, e => { S.lastError = 'Could not open the shared trip'; S.ready = true; renderAll(); });
}
boot();
})();
</script>
